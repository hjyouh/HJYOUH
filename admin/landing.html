<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing 설정 | 관리자 패널</title>
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <style>
    /* ── 슬라이드 행 ── */
    .slide-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      transition: border-color 0.2s, background 0.2s;
    }
    .slide-row.drag-over { border-color: var(--gold); background: rgba(201,169,110,0.06); }
    .slide-row.dragging  { opacity: 0.4; }
    .slide-drag-handle {
      cursor: grab; color: var(--sub); font-size: 16px;
      user-select: none; flex-shrink: 0; line-height: 1; padding-right: 4px;
    }
    .slide-drag-handle:active { cursor: grabbing; }
    .slide-num {
      flex-shrink: 0; width: 22px; text-align: center;
      font-size: 13px; font-weight: 600; color: var(--sub);
    }
    .slide-thumb {
      flex-shrink: 0; width: 100px; height: 63px;
      border-radius: 6px; object-fit: cover;
      background: var(--bg); border: 1px solid var(--border);
    }
    .slide-thumb-placeholder {
      flex-shrink: 0; width: 100px; height: 63px;
      border-radius: 6px; background: var(--bg);
      border: 1px dashed var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: var(--sub);
    }
    .slide-path-input {
      flex: 1;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text);
      font-family: inherit; font-size: 12px;
      padding: 7px 10px; outline: none; transition: border-color 0.2s;
    }
    .slide-path-input:focus { border-color: rgba(201,169,110,0.5); }
    .slide-icon-btn {
      flex-shrink: 0;
      width: 30px; height: 30px;
      border: 1px solid var(--border); border-radius: 7px;
      background: transparent; color: var(--sub); font-size: 13px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .slide-icon-btn:hover { border-color: var(--gold); color: var(--gold); }
    .slide-icon-btn.del:hover { border-color: var(--red); color: var(--red); }

    /* ── 섹션 이미지 그리드 ── */
    .section-img-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .section-img-item {
      display: flex; flex-direction: column; gap: 8px;
    }
    .section-img-label {
      font-size: 12px; font-weight: 600; color: var(--gold); text-align: center;
    }
    .section-img-preview {
      aspect-ratio: 2/3;
      border-radius: 10px; overflow: hidden;
      background: var(--bg); border: 1px solid var(--border);
      position: relative;
    }
    .section-img-preview img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .section-img-preview-empty {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: var(--sub); text-align: center;
    }
    .section-img-actions {
      display: flex; gap: 4px;
    }
    .section-img-actions input {
      flex: 1; min-width: 0;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 7px; color: var(--text);
      font-family: inherit; font-size: 11px;
      padding: 6px 8px; outline: none; transition: border-color 0.2s;
    }
    .section-img-actions input:focus { border-color: rgba(201,169,110,0.5); }
  </style>
</head>
<body>

<header class="admin-header">
  <div class="admin-logo">유형재 <span>관리자 패널</span></div>
  <div class="header-right">
    <a href="../index.html" target="_blank" class="header-preview-btn">홈페이지 보기 →</a>
  </div>
</header>

<div class="admin-body">
  <nav class="sidebar">
    <a href="home.html"       class="sidebar-item">관리자페이지</a>
    <a href="landing.html"    class="sidebar-item active">Landing</a>
    <a href="instructor.html" class="sidebar-item">강사</a>
    <a href="lectures.html"   class="sidebar-item">강의 관리</a>
    <a href="works.html"      class="sidebar-item">작업들</a>
    <a href="works.html"      class="sidebar-item sidebar-item-sub">AI영화</a>
    <a href="works.html"      class="sidebar-item sidebar-item-sub">도서</a>
    <a href="mv.html"         class="sidebar-item">M/V</a>
    <a href="contact.html"    class="sidebar-item">Contact</a>
    <div style="flex:1;"></div>
    <a href="members.html"    class="sidebar-item">회원관리</a>
  </nav>

  <main class="admin-main">

    <div class="panel-header">
      <div>
        <div class="panel-title">Landing 설정</div>
        <div class="panel-subtitle">메인 슬라이드 이미지와 홈 메시지를 수정합니다</div>
      </div>
    </div>

    <!-- ① 메인 슬라이드 이미지 -->
    <div class="card">
      <div class="card-title" id="slideCardTitle">🖼️ main image (0 slide)</div>
      <div id="slideList"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
        <button class="btn btn-outline btn-sm" onclick="addSlide()">+ 슬라이드 추가</button>
        <button class="btn btn-gold btn-sm" onclick="saveSlides()">저장</button>
      </div>
      <input type="file" id="slideFilePicker" accept="image/*" style="display:none;" onchange="onSlideFilePicked(this)">
    </div>

    <!-- ② 섹션 이미지 (강사/강의/작업들/문의) -->
    <div class="card">
      <div class="card-title">🖼️ 섹션 이미지</div>
      <div class="section-img-grid" id="sectionImgGrid"></div>
      <div style="display:flex; justify-content:flex-end; margin-top:14px;">
        <button class="btn btn-gold btn-sm" onclick="saveSectionPanels()">저장</button>
      </div>
      <input type="file" id="sectionFilePicker" accept="image/*" style="display:none;" onchange="onSectionFilePicked(this)">
    </div>

    <!-- ③ Landing 페이지 메시지 -->
    <div class="card">
      <div class="card-title">💬 Landing 페이지 메시지</div>
      <div style="display:flex; gap:16px; align-items:flex-start; margin-bottom:14px;">
        <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
          <label style="font-size:12px; color:var(--sub);">메인 문구</label>
          <textarea id="homeMainMsg" rows="3"
            style="width:100%; background:var(--bg2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:inherit; font-size:13px; padding:9px 12px; outline:none; resize:vertical; line-height:1.6; transition:border-color 0.2s;"
            placeholder="AI를 활용해 더 나은 미래를 만드는&#10;생성형 AI 강사 유형재입니다"></textarea>
        </div>
        <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
          <label style="font-size:12px; color:var(--sub);">부제목</label>
          <textarea id="homeSubMsg" rows="3"
            style="width:100%; background:var(--bg2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:inherit; font-size:13px; padding:9px 12px; outline:none; resize:vertical; line-height:1.6; transition:border-color 0.2s;"
            placeholder="부제목을 입력하세요"></textarea>
        </div>
      </div>
      <div class="form-row">
        <label>Mobile Message <span style="font-size:10px;color:var(--sub);">(20자 이내)</span></label>
        <input id="homeMobile" type="text" placeholder="AI로 바꾸는 당신의 내일" maxlength="20">
      </div>
      <div style="margin-top:16px;">
        <button class="btn btn-gold" onclick="saveLandingMsg()">저장</button>
      </div>
    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="admin-data.js?v=3"></script>
<script>
/* ═══════════════════════════════════════
   슬라이드 관리
═══════════════════════════════════════ */
let slidesData = loadData('landingSlides', DEFAULT_SLIDES);
let slideDragSrcIdx = null;
let activeSlidePickerIdx = null;

function renderSlides() {
  const el = document.getElementById('slideList');
  el.innerHTML = slidesData.map((path, i) => `
    <div class="slide-row" draggable="true"
         ondragstart="onSlideDragStart(event,${i})"
         ondragend="onSlideDragEnd(event)"
         ondragover="onSlideDragOver(event,${i})"
         ondrop="onSlideDrop(event,${i})">
      <span class="slide-drag-handle" title="드래그로 순서 변경">☰</span>
      <span class="slide-num">${i + 1}</span>
      ${path
        ? `<img class="slide-thumb" src="${escHtml(path)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
           <div class="slide-thumb-placeholder" style="display:none;">이미지<br>없음</div>`
        : `<div class="slide-thumb-placeholder">이미지<br>없음</div>`}
      <input class="slide-path-input" type="text" value="${escHtml(path)}"
             onchange="slidesData[${i}]=this.value"
             placeholder="../assets/images/lectures/main1.png">
      <button class="slide-icon-btn" title="미리보기 갱신" onclick="reloadSlideThumb(${i})">↻</button>
      <button class="slide-icon-btn" title="파일 선택" onclick="openSlideFilePicker(${i})">📁</button>
      <button class="slide-icon-btn del" title="삭제" onclick="deleteSlide(${i})">✕</button>
    </div>
  `).join('');
  document.getElementById('slideCardTitle').textContent = `🖼️ main image (${slidesData.length} slide)`;
}

function reloadSlideThumb(i) {
  const rows = document.querySelectorAll('#slideList .slide-row');
  const row = rows[i];
  if (!row) return;
  const input = row.querySelector('.slide-path-input');
  slidesData[i] = input.value.trim();
  renderSlides();
}

function addSlide() {
  slidesData.push('');
  renderSlides();
}

function deleteSlide(i) {
  if (slidesData.length <= 1) { toast('슬라이드는 최소 1개 필요합니다', true); return; }
  slidesData.splice(i, 1);
  renderSlides();
}

function saveSlides() {
  // 현재 입력값 동기화
  document.querySelectorAll('#slideList .slide-path-input').forEach((inp, i) => {
    slidesData[i] = inp.value.trim();
  });
  slidesData = slidesData.filter(p => p); // 빈 항목 제거
  if (saveData('landingSlides', slidesData)) { toast('슬라이드가 저장되었습니다'); renderSlides(); }
  else toast('저장 실패', true);
}

function openSlideFilePicker(i) {
  activeSlidePickerIdx = i;
  document.getElementById('slideFilePicker').click();
}

function onSlideFilePicked(input) {
  if (!input.files || !input.files[0] || activeSlidePickerIdx === null) return;
  const path = '../assets/images/' + input.files[0].name;
  slidesData[activeSlidePickerIdx] = path;
  input.value = '';
  renderSlides();
  activeSlidePickerIdx = null;
}

/* 드래그 */
function onSlideDragStart(e, i) {
  slideDragSrcIdx = i;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => e.target.closest('.slide-row').classList.add('dragging'), 0);
}
function onSlideDragEnd(e) {
  e.target.closest('.slide-row').classList.remove('dragging');
  document.querySelectorAll('#slideList .slide-row').forEach(r => r.classList.remove('drag-over'));
}
function onSlideDragOver(e, i) {
  e.preventDefault();
  document.querySelectorAll('#slideList .slide-row').forEach(r => r.classList.remove('drag-over'));
  document.querySelectorAll('#slideList .slide-row')[i]?.classList.add('drag-over');
}
function onSlideDrop(e, i) {
  e.preventDefault();
  document.querySelectorAll('#slideList .slide-row').forEach(r => r.classList.remove('drag-over'));
  if (slideDragSrcIdx === null || slideDragSrcIdx === i) { slideDragSrcIdx = null; return; }
  const moved = slidesData.splice(slideDragSrcIdx, 1)[0];
  slidesData.splice(i, 0, moved);
  slideDragSrcIdx = null;
  renderSlides();
}

/* ═══════════════════════════════════════
   섹션 이미지 (강사/강의/작업들/문의)
═══════════════════════════════════════ */
let panelsData = loadData('landingSidePanels', DEFAULT_SIDE_PANELS);
let activePanelPickerIdx = null;

function renderSectionPanels() {
  const el = document.getElementById('sectionImgGrid');
  el.innerHTML = panelsData.map((panel, i) => `
    <div class="section-img-item">
      <div class="section-img-label">${escHtml(panel.label)}</div>
      <div class="section-img-preview" id="sectionPreview-${i}">
        ${panel.path
          ? `<img src="${escHtml(panel.path)}" onerror="this.style.display='none';document.getElementById('sectionEmpty-${i}').style.display='flex';">`
          : ''}
        <div class="section-img-preview-empty" id="sectionEmpty-${i}" style="${panel.path ? 'display:none;' : ''}">이미지<br>없음</div>
      </div>
      <div class="section-img-actions">
        <input type="text" value="${escHtml(panel.path || '')}"
               onchange="panelsData[${i}].path=this.value"
               placeholder="../assets/images/...">
        <button class="slide-icon-btn" title="미리보기 갱신" onclick="reloadPanelThumb(${i})">↻</button>
        <button class="slide-icon-btn" title="파일 선택" onclick="openSectionFilePicker(${i})">📁</button>
      </div>
    </div>
  `).join('');
}

function reloadPanelThumb(i) {
  const inputs = document.querySelectorAll('#sectionImgGrid .section-img-actions input');
  if (inputs[i]) panelsData[i].path = inputs[i].value.trim();
  renderSectionPanels();
}

function openSectionFilePicker(i) {
  activePanelPickerIdx = i;
  document.getElementById('sectionFilePicker').click();
}

function onSectionFilePicked(input) {
  if (!input.files || !input.files[0] || activePanelPickerIdx === null) return;
  panelsData[activePanelPickerIdx].path = '../assets/images/' + input.files[0].name;
  input.value = '';
  renderSectionPanels();
  activePanelPickerIdx = null;
}

function saveSectionPanels() {
  // 현재 입력값 동기화
  document.querySelectorAll('#sectionImgGrid .section-img-actions input').forEach((inp, i) => {
    if (panelsData[i]) panelsData[i].path = inp.value.trim();
  });
  if (saveData('landingSidePanels', panelsData)) toast('섹션 이미지가 저장되었습니다');
  else toast('저장 실패', true);
  renderSectionPanels();
}

/* ═══════════════════════════════════════
   Landing 메시지
═══════════════════════════════════════ */
function loadLandingForm() {
  const cfg = loadData('homeConfig', DEFAULT_HOME);
  document.getElementById('homeMainMsg').value = cfg.mainMsg  || cfg.message || DEFAULT_HOME.mainMsg;
  document.getElementById('homeSubMsg').value  = cfg.subtitle || '';
  document.getElementById('homeMobile').value  = cfg.mobile   || DEFAULT_HOME.mobile;
}

function saveLandingMsg() {
  const mainMsg  = document.getElementById('homeMainMsg').value.trim();
  const subtitle = document.getElementById('homeSubMsg').value.trim();
  const cfg = {
    mainMsg,
    subtitle,
    message: mainMsg,
    mobile:  document.getElementById('homeMobile').value.trim()
  };
  if (saveData('homeConfig', cfg)) toast('저장되었습니다');
  else toast('저장 실패', true);
}

/* ── INIT ── */
renderSlides();
renderSectionPanels();
loadLandingForm();
</script>
</body>
</html>
