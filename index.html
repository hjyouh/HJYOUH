  <!-- 모바일 리디렉트 (render 전 실행 필수) -->
  <script>
    (function() {
      var isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
        || (navigator.maxTouchPoints > 1 && window.innerWidth <= 768);
      if (isMobile) {
        window.location.replace('pages/mobile/mobile-page.html');
      }
    })();
  </script>

  <!-- 외부 CDN 사전 연결 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <!-- Google Fonts 비동기 로드 (렌더 블로킹 제거) -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"></noscript>

  <!-- 히어로 첫 슬라이드 이미지 프리로드 -->
  <link rel="preload" href="assets/images/lectures/main1.webp" as="image" type="image/webp">

  <!-- Critical CSS 인라인 (초기 로딩 화면 깜빡임 방지) -->
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#0d0d0d;color:#fff;font-family:'Poppins',sans-serif}
    #app{position:relative;width:100%;min-height:100vh;background:#0d0d0d}
    .logo{position:fixed;top:16px;left:20px;z-index:1000}
    .logo-img{height:32px;width:auto}
    #page-container .loading-init{display:flex;justify-content:center;align-items:center;min-height:100vh;color:#a0a0a0}
  </style>

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=23">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/favicon.png">

  <!-- No-JS Fallback -->
  <noscript>
    <style>
      .hamburger, nav.mobile-nav { display: none !important; }
      nav.desktop-nav { display: flex !important; }
    </style>
  </noscript>
</head>
<body>
  <!-- Main App Container -->
  <div id="app">
    <!-- Logo: always fixed to #app top-left, independent of header layout -->
    <div class="logo">
      <img src="assets/images/aimt-logo-white.webp" alt="AIMT Logo" class="logo-img">
    </div>

    <!-- Header Navigation -->
    <header>
      <!-- Desktop Navigation -->
      <nav class="desktop-nav">
        <a href="#" data-page="home">Home</a>
        <a href="#" data-page="about">강사</a>
        <a href="#" data-page="lectures">강의</a>
        <a href="#" data-page="works">작품</a>
        <a href="#" data-page="prompts">프롬프트</a>
        <a href="#" data-page="mv">M/V</a>
        <a href="#" data-page="contact">Contact</a>
      </nav>

      <!-- Hamburger Menu (Mobile) -->
      <button class="hamburger" aria-label="메뉴 토글">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Mobile Navigation -->
      <nav class="mobile-nav">
        <a href="#" data-page="home">Home</a>
        <a href="#" data-page="about">강사</a>
        <a href="#" data-page="lectures">강의</a>
        <a href="#" data-page="works">작품</a>
        <a href="#" data-page="prompts">프롬프트</a>
        <a href="#" data-page="mv">M/V</a>
        <a href="#" data-page="contact">Contact</a>
      </nav>
    </header>

    <!-- Header Background Layer -->
    <div class="header-background-layer"></div>

    <!-- Page Container (Dynamic Content) -->
    <main id="page-container" class="page-wrapper">
      <!-- Pages loaded here via JavaScript -->
      <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #a0a0a0;">
        <p>로딩 중...</p>
      </div>
    </main>

    <!-- Mobile Preview Modal -->
    <div id="mobilePreviewOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;backdrop-filter:blur(6px);align-items:center;justify-content:center;" onclick="closeMobilePreview(event)">
      <div style="position:relative;width:375px;background:#1a1a1a;border-radius:48px;padding:16px;box-shadow:0 0 0 10px #111,0 30px 80px rgba(0,0,0,0.8);border:1px solid #333;">
        <!-- 노치 -->
        <div style="width:120px;height:28px;background:#111;border-radius:0 0 18px 18px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;gap:8px;">
          <div style="width:10px;height:10px;border-radius:50%;background:#222;"></div>
          <div style="width:48px;height:6px;border-radius:3px;background:#222;"></div>
        </div>
        <!-- iframe -->
        <iframe src="pages/mobile/mobile-page.html?v=2" style="width:100%;height:720px;border:none;border-radius:32px;display:block;" id="mobilePreviewFrame"></iframe>
        <!-- 홈버튼 바 -->
        <div style="width:100px;height:4px;background:#333;border-radius:2px;margin:12px auto 0;"></div>
      </div>
    </div>

    <!-- Modal Popup -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <button class="modal-close" aria-label="모달 닫기">&times;</button>
        <!-- Content inserted here -->
      </div>
    </div>
  </div>

  <!-- Supabase + 클라이언트 (defer: DOM 파싱 후 순서대로 실행) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="js/supabase-client.js"></script>

  <!-- Main JavaScript (defer) -->
  <script defer src="js/main.js?v=5"></script>
  <script>
    function openMobilePreview(e) {
      e.preventDefault();
      document.getElementById('mobilePreviewOverlay').style.display = 'flex';
    }
    function closeMobilePreview(e) {
      if (!e || e.target === document.getElementById('mobilePreviewOverlay')) {
        document.getElementById('mobilePreviewOverlay').style.display = 'none';
      }
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') document.getElementById('mobilePreviewOverlay').style.display = 'none';
    });
  </script>
</body>
</html>
