<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프롬프트 관리 | 관리자 패널</title>
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <script src="admin-auth.js"></script>
  <script>requireAuth();</script>
  <style>
    /* ── 이미지 그리드 ── */
    .prompt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .prompt-card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      background: var(--bg2);
      border: 1px solid var(--border);
      transition: border-color 0.2s, transform 0.15s;
    }
    .prompt-card:hover { border-color: var(--gold); transform: translateY(-2px); }

    .prompt-card-inner {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: var(--bg3);
    }
    .prompt-card-inner.portrait  { padding-bottom: 150%; }
    .prompt-card-inner.landscape { padding-bottom: 66.67%; }

    .prompt-card-inner img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .prompt-card-label {
      padding: 6px 8px;
      font-size: 11px;
      color: var(--sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prompt-cat-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    .prompt-del-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0,0,0,0.55);
      border: none;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
    }
    .prompt-card:hover .prompt-del-btn { opacity: 1; }
    .prompt-del-btn:hover { background: rgba(200,50,50,0.8); }

    .prompt-drag-handle {
      position: absolute;
      top: 6px;
      right: 32px;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: rgba(0,0,0,0.55);
      border: none;
      color: #fff;
      font-size: 13px;
      cursor: grab;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
      user-select: none;
    }
    .prompt-drag-handle:active { cursor: grabbing; }
    .prompt-card:hover .prompt-drag-handle { opacity: 1; }
    .prompt-drag-handle:hover { background: rgba(201,169,110,0.8); }
    .prompt-card.drag-over { border: 2px solid var(--gold); background: rgba(201,169,110,0.06); }
    .prompt-card.dragging  { opacity: 0.4; }
    .prompt-card.inactive  { opacity: 0.38; }
    .prompt-active-btn {
      position: absolute;
      top: 32px;
      right: 6px;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      cursor: pointer;
      border: 1px solid;
      transition: all 0.2s;
      opacity: 0;
      line-height: 1.6;
    }
    .prompt-card:hover .prompt-active-btn { opacity: 1; }
    .prompt-active-btn.is-active   { background:rgba(34,197,94,0.12); color:#16a34a; border-color:rgba(34,197,94,0.4); }
    .prompt-active-btn.is-inactive { background:rgba(150,150,150,0.12); color:#888; border-color:rgba(150,150,150,0.3); }

    .prompt-add-card {
      position: relative;
      border-radius: 10px;
      border: 2px dashed var(--border);
      cursor: pointer;
      background: transparent;
      transition: border-color 0.2s, background 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      color: var(--sub);
      font-size: 13px;
      gap: 6px;
    }
    .prompt-add-card:hover { border-color: var(--gold); background: rgba(201,169,110,0.05); color: var(--gold); }
    .prompt-add-icon { font-size: 28px; line-height: 1; }

    .prompt-tabs { display: flex; gap: 6px; margin-bottom: 16px; }

    /* ══ 팝업 모달 ══ */
    #promptModal .modal-box {
      max-width: 700px;
      width: 95vw;
    }
    .pm-body {
      display: flex;
      gap: 16px;
      align-items: stretch;
    }

    .pm-img-col {
      width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .pm-img-box {
      position: relative;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg2);
      overflow: hidden;
      flex: 1;
      min-height: 260px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .pm-img-box:hover { border-color: var(--gold); }
    .pm-img-box img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
    .pm-img-hint {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--sub);
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
      pointer-events: none;
    }
    .pm-img-hint-icon { font-size: 28px; }
    .pm-img-ratio { display: flex; gap: 6px; }
    .pm-ratio-btn {
      flex: 1;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg2);
      color: var(--sub);
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .pm-ratio-btn.active { border-color: var(--gold); color: var(--gold); background: var(--gold2); }

    .pm-text-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .pm-field label {
      display: block;
      font-size: 12px;
      color: var(--sub);
      margin-bottom: 5px;
    }
    .pm-field input,
    .pm-field select {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .pm-field input:focus,
    .pm-field select:focus { border-color: rgba(201,169,110,0.5); }
    .pm-prompt-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .pm-prompt-area label {
      display: block;
      font-size: 12px;
      color: var(--sub);
      margin-bottom: 5px;
    }
    .pm-prompt-area textarea {
      flex: 1;
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      resize: none;
      line-height: 1.65;
      transition: border-color 0.2s;
      min-height: 180px;
    }
    .pm-prompt-area textarea:focus { border-color: rgba(201,169,110,0.5); }
  </style>
</head>

<script src="../js/supabase-client.js"></script>
<script src="admin-data.js"></script>
<script>
/* ── 데이터 ── */
let promptsData = loadData('promptsData', DEFAULT_PROMPTS);
// localStorage에 빈 배열만 있으면 기본값 사용
{
  const total = ['image','video','etc'].reduce((n,c) => n + (promptsData[c]||[]).length, 0);
  if (total === 0) promptsData = JSON.parse(JSON.stringify(DEFAULT_PROMPTS));
}
let currentFilter = 'all';
let currentRatio = 'portrait';
let pmFileDataUrl = null;

const CAT_LABEL = { image: '🖼 이미지', video: '🎬 영상', etc: '✨ 기타' };

/* ── 드래그 리오더 ── */
let dragSrcIdx = null;
let currentItems = [];

function onPmDragStart(e, idx) {
  dragSrcIdx = idx;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => {
    const cards = document.querySelectorAll('#promptGrid .prompt-card');
    if (cards[idx]) cards[idx].classList.add('dragging');
  }, 0);
}

function onPmDragEnd(e) {
  document.querySelectorAll('#promptGrid .prompt-card').forEach(c => {
    c.classList.remove('dragging', 'drag-over');
  });
}

function onPmDragOver(e, idx) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('#promptGrid .prompt-card').forEach(c => c.classList.remove('drag-over'));
  const cards = document.querySelectorAll('#promptGrid .prompt-card');
  if (cards[idx]) cards[idx].classList.add('drag-over');
}

function onPmDrop(e, idx) {
  e.preventDefault();
  document.querySelectorAll('#promptGrid .prompt-card').forEach(c => c.classList.remove('drag-over', 'dragging'));
  if (dragSrcIdx === null || dragSrcIdx === idx) { dragSrcIdx = null; return; }

  // currentItems는 newest-first(역순) 배열 → 재정렬
  const moved = currentItems.splice(dragSrcIdx, 1)[0];
  currentItems.splice(idx, 0, moved);

  // storage order로 복원: 각 카테고리별로 분리해서 저장
  const storageOrder = [...currentItems].reverse();
  ['image','video','etc'].forEach(c => {
    promptsData[c] = storageOrder
      .filter(i => (i._cat || i.cat) === c)
      .map(({ _cat, ...rest }) => rest);
  });

  saveData('promptsData', promptsData);
  renderGrid();
  toast('순서가 저장되었습니다');
  dragSrcIdx = null;
}

/* ── 탭 + 사이드바 active 전환 ── */
function switchPromptsTab(cat) {
  currentFilter = cat;

  // 상단 탭 버튼
  const tabMap = { all: 'tabAll', image: 'tabImage', video: 'tabVideo', etc: 'tabEtc' };
  Object.entries(tabMap).forEach(([k, id]) => {
    const el = document.getElementById(id);
    el.className = 'btn btn-sm ' + (k === cat ? 'btn-gold' : 'btn-outline');
  });

  // 사이드바 active
  document.getElementById('sidePrompts').classList.remove('active');
  document.getElementById('sideImage').classList.toggle('active', cat === 'image');
  document.getElementById('sideVideo').classList.toggle('active', cat === 'video');
  document.getElementById('sideEtc').classList.toggle('active',   cat === 'etc');
  if (cat === 'all') {
    document.getElementById('sidePrompts').classList.add('active');
  }

  renderGrid();
}

/* ── 그리드 렌더 ── */
function renderGrid() {
  const grid = document.getElementById('promptGrid');
  const cats = currentFilter === 'all' ? ['image', 'video', 'etc'] : [currentFilter];
  let items = [];
  cats.forEach(c => {
    (promptsData[c] || []).forEach(p => items.push({ ...p, _cat: c }));
  });
  items = items.slice().reverse();
  currentItems = items; // 드래그 리오더용

  let html = `
    <div class="prompt-add-card" onclick="openPromptModal()">
      <span class="prompt-add-icon">+</span>
      <span>프롬프트 추가</span>
    </div>
  `;

  items.forEach((item, i) => {
    const ratio    = item.ratio || 'portrait';
    const src      = item.imgDataUrl || item.imgPath || '';
    const isActive = item.active !== false;
    html += `
      <div class="prompt-card${isActive ? '' : ' inactive'}" draggable="true"
           ondragstart="onPmDragStart(event,${i})"
           ondragend="onPmDragEnd(event)"
           ondragover="onPmDragOver(event,${i})"
           ondrop="onPmDrop(event,${i})"
           onclick="openPromptModal('${escHtml(item.id)}')">
        <div class="prompt-card-inner ${ratio}">
          ${src ? `<img src="${escHtml(src)}" alt="" onerror="this.style.display='none'">` : ''}
        </div>
        <span class="prompt-cat-badge">${CAT_LABEL[item._cat] || item._cat}</span>
        <button class="prompt-drag-handle" title="드래그로 순서 변경"
                onmousedown="event.stopPropagation()"
                onclick="event.stopPropagation()">☰</button>
        <button class="prompt-del-btn" onclick="deletePrompt(event,'${escHtml(item.id)}','${item._cat}')">✕</button>
        <button class="prompt-active-btn ${isActive ? 'is-active' : 'is-inactive'}"
                onclick="togglePromptActive(event,'${escHtml(item.id)}','${item._cat}')">${isActive ? 'ON' : 'OFF'}</button>
        <div class="prompt-card-label">${escHtml(item.title || item.prompt.slice(0,30) + '…')}</div>
      </div>
    `;
  });

  grid.innerHTML = html;
}

/* ── 모달 열기 ── */
function openPromptModal(id) {
  pmFileDataUrl = null;
  document.getElementById('promptEditId').value = id || '';
  document.getElementById('pmPreviewImg').style.display = 'none';
  document.getElementById('pmImgHint').style.display = 'flex';
  document.getElementById('pmImgPath').value = '';
  document.getElementById('pmTitle').value = '';
  document.getElementById('pmPrompt').value = '';
  document.getElementById('pmCategory').value = currentFilter !== 'all' ? currentFilter : 'image';
  setRatio('portrait');

  if (id) {
    const item = findPromptById(id);
    if (item) {
      document.getElementById('promptModalTitle').textContent = '프롬프트 수정';
      document.getElementById('pmCategory').value = item._cat || item.cat || 'image';
      document.getElementById('pmTitle').value   = item.title || '';
      document.getElementById('pmPrompt').value  = item.prompt || '';
      setRatio(item.ratio || 'portrait');
      const src = item.imgDataUrl || item.imgPath || '';
      if (src) {
        document.getElementById('pmPreviewImg').src = src;
        document.getElementById('pmPreviewImg').style.display = 'block';
        document.getElementById('pmImgHint').style.display = 'none';
        document.getElementById('pmImgPath').value = item.imgPath || '';
        pmFileDataUrl = item.imgDataUrl || null;
      }
    }
  } else {
    document.getElementById('promptModalTitle').textContent = '프롬프트 추가';
  }

  document.getElementById('promptModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePromptModal() {
  document.getElementById('promptModal').classList.remove('open');
  document.body.style.overflow = '';
}

/* ── 비율 선택 ── */
function setRatio(ratio) {
  currentRatio = ratio;
  document.getElementById('ratioPortrait').classList.toggle('active',  ratio === 'portrait');
  document.getElementById('ratioLandscape').classList.toggle('active', ratio === 'landscape');
}

/* ── 파일 선택 ── */
async function onPmFilePicked(input) {
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];
  // 즉시 미리보기 + 비율 자동 감지
  const reader = new FileReader();
  reader.onload = e => {
    pmFileDataUrl = e.target.result;
    const img  = document.getElementById('pmPreviewImg');
    const hint = document.getElementById('pmImgHint');
    img.src = pmFileDataUrl;
    img.style.display = 'block';
    hint.style.display = 'none';
    const tmp = new Image();
    tmp.onload = () => setRatio(tmp.naturalHeight >= tmp.naturalWidth ? 'portrait' : 'landscape');
    tmp.src = pmFileDataUrl;
  };
  reader.readAsDataURL(file);
  // Supabase Storage 업로드
  toast('이미지 업로드 중...');
  const url = window.sbUploadImage ? await sbUploadImage(file, 'prompts') : null;
  if (url) {
    document.getElementById('pmImgPath').value = url;
    pmFileDataUrl = null;
    toast('이미지 업로드 완료 ✓');
  } else {
    document.getElementById('pmImgPath').value = '../assets/images/prompts/' + file.name;
    toast('업로드 실패 — 경로를 직접 입력하세요', true);
  }
  input.value = '';
}

/* ── 이미지 경로 입력 → 미리보기 ── */
function onPmPathInput(val) {
  if (!val) return;
  const img  = document.getElementById('pmPreviewImg');
  const hint = document.getElementById('pmImgHint');
  img.onload  = () => { img.style.display = 'block'; hint.style.display = 'none'; };
  img.onerror = () => { img.style.display = 'none';  hint.style.display = 'flex'; };
  img.src = val;
  pmFileDataUrl = null;
}

/* ── 저장 ── */
function savePrompt() {
  const prompt = document.getElementById('pmPrompt').value.trim();
  if (!prompt) { toast('프롬프트 내용을 입력해주세요', true); return; }

  const cat     = document.getElementById('pmCategory').value;
  const title   = document.getElementById('pmTitle').value.trim();
  const imgPath = document.getElementById('pmImgPath').value.trim();
  const editId  = document.getElementById('promptEditId').value;
  const id = editId || (cat + '-' + Date.now());

  const item = {
    id, cat, title, prompt,
    ratio: currentRatio,
    imgPath: imgPath || null,
    imgDataUrl: pmFileDataUrl || null
  };

  if (!promptsData[cat]) promptsData[cat] = [];

  if (editId) {
    ['image', 'video', 'etc'].forEach(c => {
      promptsData[c] = (promptsData[c] || []).filter(p => p.id !== editId);
    });
  }
  promptsData[cat].push(item);

  saveData('promptsData', promptsData);
  closePromptModal();
  renderGrid();
  toast(editId ? '프롬프트가 수정되었습니다' : '프롬프트가 추가되었습니다');
}

/* ── 삭제 ── */
function deletePrompt(e, id, cat) {
  e.stopPropagation();
  if (!confirm('이 프롬프트를 삭제하시겠습니까?')) return;
  promptsData[cat] = (promptsData[cat] || []).filter(p => p.id !== id);
  saveData('promptsData', promptsData);
  renderGrid();
  toast('프롬프트가 삭제되었습니다');
}

function togglePromptActive(e, id, cat) {
  e.stopPropagation();
  const item = (promptsData[cat] || []).find(p => p.id === id);
  if (!item) return;
  item.active = item.active === false ? true : false;
  saveData('promptsData', promptsData);
  renderGrid();
  toast(item.active ? '활성화되었습니다' : '비활성화되었습니다');
}

/* ── id로 찾기 ── */
function findPromptById(id) {
  for (const cat of ['image', 'video', 'etc']) {
    const found = (promptsData[cat] || []).find(p => p.id === id);
    if (found) return { ...found, _cat: cat };
  }
  return null;
}

/* ── 프롬프트 페이지 메시지 저장/로드 ── */
function loadPromptsMsg() {
  const d = loadData('pageMsgPrompts', {});
  document.getElementById('promptMainMsg').value   = d.mainMsg  || '';
  document.getElementById('promptSubMsg').value    = d.subtitle || '';
  document.getElementById('promptMobileMsg').value = d.mobile   || '';
}

function savePromptsMsg() {
  const d = {
    mainMsg:  document.getElementById('promptMainMsg').value.trim(),
    subtitle: document.getElementById('promptSubMsg').value.trim(),
    mobile:   document.getElementById('promptMobileMsg').value.trim()
  };
  if (saveData('pageMsgPrompts', d)) toast('메시지가 저장되었습니다');
  else toast('저장 실패', true);
}

/* ── INIT ── */
(async function init() {
  try {
    const { data } = await _sb.from('settings').select('value').eq('key','promptsData').maybeSingle();
    const cloud = data?.value;
    if (cloud) {
      // Supabase 데이터가 있으면 항상 우선 사용 (로컬 기본값이 덮어쓰는 버그 방지)
      promptsData = cloud;
      const total = ['image','video','etc'].reduce((n,c) => n + (promptsData[c]||[]).length, 0);
      if (total === 0) promptsData = JSON.parse(JSON.stringify(DEFAULT_PROMPTS));
      try { localStorage.setItem('promptsData', JSON.stringify(promptsData)); } catch(e) {}
    } else {
      // Supabase에 데이터 없으면 현재 로컬 데이터를 저장
      saveData('promptsData', promptsData);
    }
  } catch(e) {}

  loadPromptsMsg();

  // URL 파라미터로 초기 탭 결정
  const params = new URLSearchParams(location.search);
  const tab = params.get('tab') || 'all';
  switchPromptsTab(tab);
})();
</script>
