<style>
  /* ===== works.html CSS 그대로 재사용 ===== */
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(50px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .works-section {
    position: absolute;
    inset: 0;
    display: flex;
    font-family: 'Poppins', 'SUITE', sans-serif;
    overflow: hidden;
  }

  .works-main {
    flex: 1 1 0;
    min-width: 0;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .works-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    /* background-image은 initMvPage()에서 동적으로 설정 */
  }

  .works-bg-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
  }

  /* 줌 레이어 */
  .works-zoom-layer {
    position: absolute; inset: 0; z-index: 25;
    opacity: 0; pointer-events: none;
    transition: opacity 0.45s cubic-bezier(0.22,1,0.36,1);
  }
  .works-zoom-layer.active { opacity: 1; pointer-events: all; }
  .works-zoom-img {
    position: absolute; inset: 0;
    background-size: contain; background-repeat: no-repeat; background-position: center;
    transform: translateY(30px) scale(0.97);
    transition: transform 0.45s cubic-bezier(0.22,1,0.36,1); z-index: 2;
  }
  .works-zoom-layer.active .works-zoom-img { transform: translateY(0) scale(1); }
  .works-zoom-ol { position: absolute; inset: 0; background: rgba(0,0,0,0.55); z-index: 1; }
  .works-zoom-close {
    position: absolute; top: 70px; right: 16px;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.25); color: #fff;
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease; z-index: 100;
  }
  .works-zoom-close:hover { background: rgba(201,169,110,0.8); color: #0d0d0d; transform: scale(1.1); }

  /* 카드 그리드 */
  .card-grid-wrap {
    position: relative; flex: 1 1 0; min-height: 0;
    overflow-y: auto; overflow-x: visible;
    padding: 12px 24px 80px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent;
  }
  .card-grid {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; align-content: flex-start;
  }

  /* MV 카드 */
  .work-card {
    position: relative;
    background: rgba(20,20,20,0.85);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; overflow: hidden; cursor: pointer;
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    opacity: 0; animation: slideUp 1s ease forwards;
    width: var(--card-w, calc((100% - 10px) / 2));
    flex-shrink: 0;
  }
  .work-card:nth-child(1) { animation-delay: 0.3s; }
  .work-card:nth-child(2) { animation-delay: 0.6s; }
  .work-card:nth-child(3) { animation-delay: 0.9s; }
  .work-card:nth-child(4) { animation-delay: 1.2s; }

  .work-card:hover { border-color: rgba(201,169,110,0.5); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
  /* 선택된 카드 X 플레이스홀더 (works.html 동일 패턴) */
  .work-card.selected-placeholder {
    cursor: default;
    pointer-events: none;
    border-color: rgba(201,169,110,0.4) !important;
    transform: none !important;
    box-shadow: none !important;
  }
  .work-card.selected-placeholder .card-img-wrap {
    background: rgba(201,169,110,0.08) !important;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .work-card-x {
    font-size: 28px;
    color: rgba(201,169,110,0.5);
    font-weight: 300;
  }

  .card-img-wrap {
    position: relative;
    width: 100%; aspect-ratio: 16/9; overflow: hidden; background: rgba(30,20,40,0.9);
  }

  /* 채널 바로가기 버튼 — works.html detail-link-btn 동일 스타일 */
  .mv-channel-btn {
    display: inline-flex; align-items: center; gap: 5px;
    margin-top: 12px;
    padding: 7px 14px;
    border: 1px solid rgba(201,169,110,0.5);
    border-radius: 999px;
    color: var(--accent-gold, #c9a96e);
    font-size: 12px;
    font-family: 'Poppins','SUITE',sans-serif;
    text-decoration: none;
    transition: all 0.2s ease;
    cursor: pointer;
  }
  .mv-channel-btn:hover { background: var(--accent-gold, #c9a96e); color: #0d0d0d; }
  .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
  .work-card:hover .card-img-wrap img { transform: scale(1.05); }

  .card-info { padding: 12px 14px 14px; }
  .card-badge { font-size: 10px; color: #c9a96e; font-weight: 600; margin-bottom: 4px; letter-spacing: 0.3px; }
  .card-title-wrap { margin-bottom: 2px; display: flex; align-items: baseline; gap: 8px; overflow: hidden; }
  .card-title { font-size: 15px; font-weight: 700; color: #fff; line-height: 1.3; white-space: nowrap; flex-shrink: 0; }
  .card-subtitle { font-size: 13px; color: rgba(255,255,255,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 메시지 박스 */
  .works-msg {
    position: absolute; bottom: 20px; left: 32px;
    z-index: 20; background: rgba(0,0,0,0.55) !important;
    backdrop-filter: blur(12px); border-radius: 16px; width: 420px;
  }
  .works-msg .message-box-text { font-size: 20px; line-height: 1.65; color: #fff; }
  .works-msg .message-box-sub  { font-size: 13px; opacity: 0.75; margin-top: 4px; }

  /* 우측 패널 */
  .works-panel {
    width: var(--panel-width); flex-shrink: 0; height: 100%;
    background: var(--bg-primary); border-left: 1px solid var(--border-color);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-empty, .panel-detail { flex: 1 1 0; min-height: 0; }
  .panel-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .panel-empty p { font-size: 14px; color: rgba(255,255,255,0.55); line-height: 1.7; }

  .panel-detail { padding: 60px 24px 28px; overflow-y: auto; display: flex; flex-direction: column; }
  .detail-tag {
    display: inline-block; font-size: 11px; font-weight: 700;
    color: #c9a96e; border: 1px solid rgba(201,169,110,0.35);
    border-radius: 999px; padding: 4px 12px; margin-bottom: 12px; width: fit-content;
  }
  .detail-title { font-size: 22px; font-weight: 800; color: #fff; margin: 0 0 4px; line-height: 1.3; }
  .detail-year  { font-size: 13px; color: rgba(255,255,255,0.5); margin: 0 0 16px; }
  .detail-synopsis {
    font-size: 13px; color: rgba(255,255,255,0.75); line-height: 1.85;
    margin-bottom: 20px; white-space: pre-line;
  }
  /* 장르/컨셉/소속 + 채널버튼 블록 → 패널 맨 아래 고정 */
  .detail-bottom { margin-top: auto; }
  .detail-info { margin-top: 0; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); }
  .detail-info-row {
    display: flex; gap: 8px; align-items: baseline;
    font-size: 13px; color: rgba(255,255,255,0.75); padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .detail-info-row:last-child { border-bottom: none; }
  .detail-info-label { font-size: 11px; color: #c9a96e; font-weight: 700; min-width: 48px; }

  /* 패널 푸터 */
  .works-panel-footer {
    padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  .wpf-left { display: flex; flex-direction: column; gap: 3px; }
  .wpf-row  { display: flex; align-items: center; gap: 6px; }
  .wpf-item { font-size: 11px; color: rgba(255,255,255,0.45); text-decoration: none; transition: color 0.15s; }
  .wpf-item:hover { color: #c9a96e; }
  .wpf-sep  { font-size: 11px; color: rgba(255,255,255,0.2); }
  .wpf-btn  {
    background: #c9a96e; color: #0d0d0d; border: none; border-radius: 8px;
    padding: 8px 16px; font-size: 13px; font-weight: 700;
    font-family: 'Poppins','SUITE',sans-serif; cursor: pointer;
    transition: background 0.2s;
  }
  .wpf-btn:hover { background: #e0c080; }

  @media (max-width: 900px) {
    .works-panel { display: none; }
    .works-msg { left: 16px; right: 16px; bottom: 16px; width: auto; }
    .card-grid-wrap { padding: 56px 12px 80px; }
  }
</style>

<script>
(function () {
  /* ===== MV 데이터 ===== */
  let MV_DATA = [
    {
      id: 'mv-1',
      tag: '🎭 클래식 명화 · BGM채널',
      title: 'Korisian',
      sub: '명화에 음악을 입히다',
      imgPath: 'assets/images/mv/@Korisian.png',
      channelUrl: 'https://www.youtube.com/@Korisian', active: true,
      genre: '클래식 명화 BGM · 시네마틱 아트',
      concept: '명화 + 감성 음악의 시각적 콜라보',
      affiliation: "Maison d'Étoile",
      synopsis: '"그림은 말이 없지만, 음악이 더해지면 이야기가 된다."\n\nKorisian은 인상주의, 낭만주의 시대의 명화들에 감성적인 BGM을 입혀 새로운 감상 경험을 선사하는 시네마틱 아트 채널입니다. 모네의 수련, 르누아르의 오후, 드가의 발레리나 — 캔버스 위에 잠들어 있던 빛과 색이 음악과 함께 살아 숨쉬기 시작합니다.\n\n바쁜 일상 속 잠깐의 멈춤. Korisian이 만드는 공간은 미술관도, 음악홀도 아닌, 그 사이 어딘가의 조용한 방입니다.'
    },
    {
      id: 'mv-2',
      tag: '🎙️ French Chanson · 클래식 샹송',
      title: 'Isabelle Lumière',
      sub: '빛의 목소리',
      imgPath: 'assets/images/mv/Isabelle Lumière.png',
      channelUrl: 'https://www.youtube.com/@IsabelleLumiere', active: true,
      genre: 'French Chanson · 드라마틱 소프라노',
      concept: '에디트 피아프 스타일 · 1950s 파리 카바레',
      affiliation: "Maison d'Étoile",
      synopsis: '"파리의 밤은 노래로 기억된다."\n\nIsabelle Lumière(이자벨 뤼미에르)는 에디트 피아프의 영혼을 계승한 드라마틱 소프라노 샹송 아티스트입니다. 아코디언의 선율, 현악의 물결, 그리고 속삭임에서 폭발적인 고음으로 이어지는 다이나믹한 감정선.\n\n1950년대 파리 카바레의 향기를 담은 그녀의 음악은 시간을 초월해 듣는 이의 가슴 깊은 곳을 건드립니다.'
    },
    {
      id: 'mv-3',
      tag: '🌙 French Jazz · Cabaret Noir',
      title: 'Margot Ombre',
      sub: '그림자 속의 목소리',
      imgPath: 'assets/images/mv/Margot Ombre.png',
      channelUrl: 'https://www.youtube.com/@MargotOmbre', active: false,
      genre: 'French Jazz · Cabaret Noir',
      concept: '누아르 · 서정적 · 파리 강변의 밤',
      affiliation: "Maison d'Étoile",
      synopsis: '"빛이 있는 곳엔 반드시 그림자가 있다."\n\nMargot Ombre(마르고 옴브르)는 파리 센강변의 밤을 닮은 아티스트입니다. Barbara와 Juliette Gréco의 계보를 잇는 누아르 재즈 샹송. 차갑고 서정적인 목소리로 파리의 골목, 빗속의 카페, 그리고 혼자인 밤을 노래합니다.\n\nIsabelle Lumière가 \'빛\'이라면, Margot Ombre는 그 빛이 만들어내는 \'그림자\' — 둘이 함께 비로소 하나의 완전한 세계가 됩니다.'
    },
    {
      id: 'mv-4',
      tag: '🌸 French K-POP · 프렌치 팝',
      title: 'Hana Chérie',
      sub: '파리에서 온 봄',
      imgPath: 'assets/images/mv/Hana Chérie.png',
      channelUrl: 'https://www.youtube.com/@HanaCherieOfficial', active: false,
      genre: 'French K-POP · French Pop',
      concept: '한국 감성 · 프랑스어 · 따뜻한 설렘',
      affiliation: "Maison d'Étoile",
      synopsis: '"프랑스어로 노래하는 한국의 감성."\n\nHana Chérie(하나 쉐리)는 Maison d\'Étoile의 가장 현대적인 얼굴입니다. 한국의 감성과 K-POP의 세련된 사운드를 프랑스어로 담아낸 독보적인 아티스트.\n\n파리 유학 중 프랑스어와 사랑에 빠진 한국 소녀의 이야기가 그녀의 음악 속에 흐릅니다. Isabelle의 드라마틱함도, Margot의 누아르도 아닌 — Hana만의 봄날 같은 설렘이 당신을 기다립니다.'
    }
  ];

  let selectedMvId   = null;
  let savedMvCardEl   = null;   // X로 교체된 카드 요소 저장
  let savedMvCardHtml = null;   // X로 교체 전 원본 innerHTML 저장

  function encodeMvImgPath(p) {
    if (!p || p.startsWith('data:') || p.startsWith('http')) return p;
    return p.split('/').map((seg, i, arr) =>
      i === arr.length - 1 ? encodeURIComponent(seg).replace(/%40/g, '@') : seg
    ).join('/');
  }

  /* ===== 그리드 렌더 ===== */
  function renderMvGrid() {
    const grid = document.getElementById('mvCardGrid');
    if (!grid) return;
    const cols = 2;
    grid.style.setProperty('--card-w', `calc((100% - ${(cols-1)*10}px) / ${cols})`);
    grid.innerHTML = '';
    MV_DATA.forEach(item => {
      const imgSrc = item.imgDataUrl || encodeMvImgPath(item.imgPath);
      const card = document.createElement('div');
      card.className = 'work-card' + (item.id === selectedMvId ? ' selected' : '');
      card.dataset.id = item.id;
      card.innerHTML = `
        <div class="card-img-wrap">
          <img src="${imgSrc}" alt="${item.title}" loading="lazy">
        </div>
        <div class="card-info">
          <div class="card-badge">${item.tag}</div>
          <div class="card-title-wrap">
            <div class="card-title">${item.title}</div>
            <div class="card-subtitle">${item.sub || ''}</div>
          </div>
        </div>
      `;
      card.addEventListener('click', () => selectMV(item.id));
      grid.appendChild(card);
    });
  }

  /* ===== 패널 초기화 (works.html showPanelEmpty 동일 패턴) ===== */
  function showMvPanelEmpty() {
    document.getElementById('mvPanelEmpty').style.display  = 'flex';
    document.getElementById('mvPanelDetail').style.display = 'none';
    const btnEl = document.getElementById('mvChannelBtn');
    if (btnEl) btnEl.innerHTML = '';
  }

  /* ===== 카드 선택 (works.html selectWork 동일 패턴) ===== */
  function selectMV(id) {
    /* 이전에 X로 교체된 카드가 있으면 먼저 원본 복원 (재렌더링 없이) */
    if (savedMvCardEl && savedMvCardHtml) {
      savedMvCardEl.classList.remove('selected-placeholder');
      savedMvCardEl.innerHTML = savedMvCardHtml;
      savedMvCardEl = null;
      savedMvCardHtml = null;
    }

    /* 같은 카드 재클릭 → 선택 해제 */
    if (selectedMvId === id) {
      selectedMvId = null;
      const zl = document.getElementById('mvZoomLayer');
      if (zl) zl.classList.remove('active');
      showMvPanelEmpty();
      return;   /* 재렌더링 없이 종료 */
    }

    selectedMvId = id;
    const item = MV_DATA.find(d => d.id === id);
    if (!item) return;

    /* 1) 줌 레이어 활성화 (works.html 동일) */
    const zoomLayer = document.getElementById('mvZoomLayer');
    const zoomImg   = document.getElementById('mvZoomImg');
    if (zoomLayer && zoomImg) {
      const imgSrc = item.imgDataUrl || encodeMvImgPath(item.imgPath);
      if (imgSrc) {
        zoomImg.style.backgroundImage = `url("${imgSrc}")`;
        zoomLayer.classList.add('active');
      } else {
        zoomImg.style.backgroundImage = '';
        zoomLayer.classList.remove('active');
      }
    }

    /* 2) 선택 카드 X로 교체 — 원본 HTML 저장 후 교체 */
    const activeCard = document.querySelector(`#mvCardGrid .work-card[data-id="${id}"]`);
    if (activeCard) {
      savedMvCardEl   = activeCard;
      savedMvCardHtml = activeCard.innerHTML;
      activeCard.classList.add('selected-placeholder');
      activeCard.innerHTML = '<div class="card-img-wrap"><div class="work-card-x">✕</div></div>';
    }

    /* 3) 패널 채우기 */
    document.getElementById('mvPanelEmpty').style.display  = 'none';
    document.getElementById('mvPanelDetail').style.display = 'flex';

    const setEl = (elId, html) => { const el = document.getElementById(elId); if (el) el.innerHTML = html; };
    setEl('mvDetailTag',      item.tag);
    setEl('mvDetailTitle',    item.title);
    setEl('mvDetailSub',      item.sub);
    setEl('mvDetailSynopsis', (item.synopsis || '').replace(/\n/g,'<br>'));
    setEl('mvDetailInfo', `
      <div class="detail-info-row"><span class="detail-info-label">장르</span>${item.genre}</div>
      <div class="detail-info-row"><span class="detail-info-label">컨셉</span>${item.concept}</div>
      <div class="detail-info-row"><span class="detail-info-label">소속</span>${item.affiliation}</div>
    `);

    /* 채널 바로가기 버튼 */
    const btnEl = document.getElementById('mvChannelBtn');
    if (btnEl) {
      if (!item.channelUrl) {
        btnEl.innerHTML = '';
      } else if (item.active === false) {
        btnEl.innerHTML = `<span class="mv-channel-btn" style="opacity:0.35;cursor:not-allowed;pointer-events:none;">▶ 준비 중입니다</span>`;
      } else {
        btnEl.innerHTML = `<a class="mv-channel-btn" href="${item.channelUrl}" target="_blank" rel="noopener">▶ YouTube 채널 바로가기</a>`;
      }
    }
  }

  /* ===== 줌 레이어 ===== */
  function openMvZoom(src) {
    const layer = document.getElementById('mvZoomLayer');
    const img   = document.getElementById('mvZoomImg');
    if (!layer || !img) return;
    const encoded = src.startsWith('data:') ? src : encodeMvImgPath(src);
    img.style.backgroundImage = `url('${encoded}')`;
    layer.classList.add('active');
  }
  function closeMvZoom() {
    const layer = document.getElementById('mvZoomLayer');
    if (layer) layer.classList.remove('active');
    selectedMvId = null;
    /* 카드 복원 — 전체 재렌더링 없이 해당 카드만 복원 */
    if (savedMvCardEl && savedMvCardHtml) {
      savedMvCardEl.classList.remove('selected-placeholder');
      savedMvCardEl.innerHTML = savedMvCardHtml;
      savedMvCardEl = null;
      savedMvCardHtml = null;
    }
    showMvPanelEmpty();
  }

  /* ===== INIT ===== */
  async function initMvPage() {
    selectedMvId = null;
    try {
      let raw = null;
      if (window.sbLoad) raw = await window.sbLoad('mvData', null);
      if (!raw) {
        const saved = localStorage.getItem('mvData');
        if (saved) raw = JSON.parse(saved);
      }
      if (raw && Array.isArray(raw) && raw.length) {
        MV_DATA = raw.map(item => ({
          ...item,
          imgPath:    (item.imgPath || item.thumb || '').replace(/^\.\.\//, ''),
          imgDataUrl: item.imgDataUrl || null
        }));
      }
    } catch(e) {}

    // 배경 이미지: 첫 번째 active 항목 이미지를 동적으로 설정
    try {
      const bgEl = document.querySelector('.works-bg');
      if (bgEl) {
        const first = MV_DATA[0];
        if (first) {
          const bgSrc = first.imgDataUrl || encodeMvImgPath(first.imgPath);
          if (bgSrc) bgEl.style.backgroundImage = `url("${bgSrc}")`;
        }
      }
    } catch(e) {}

    // 페이지 메시지 로드
    try {
      let msg = null;
      if (window.sbLoad) msg = await window.sbLoad('mvPageMsg', null);
      if (!msg) { const s = localStorage.getItem('mvPageMsg'); if (s) msg = JSON.parse(s); }
      if (msg) {
        const main = typeof msg === 'string' ? msg : (msg.mainMsg || '');
        const sub  = typeof msg === 'string' ? '' : (msg.subtitle || '');
        const txtEl = document.getElementById('mvMsgText');
        const subEl = document.getElementById('mvMsgSub');
        if (txtEl && main) txtEl.textContent = main.replace(/\\n/g, '\n');
        if (subEl && sub)  subEl.textContent = sub;
      }
    } catch(e) {}

    renderMvGrid();
    showMvPanelEmpty();
  }

  /* ===== window exports ===== */
  window.selectMV         = selectMV;
  window.showMvPanelEmpty = showMvPanelEmpty;
  window.openMvZoom       = openMvZoom;
  window.closeMvZoom      = closeMvZoom;
  window.initMvPage       = initMvPage;

  if (document.getElementById('mvCardGrid')) initMvPage();
})();
</script>
