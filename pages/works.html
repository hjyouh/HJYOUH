  function fixWorksData(parsed) {
    const fixPath = (items, subfolder) => (items || []).map(item => {
      if (item.synopsisFull && !item.intro) item.intro = item.synopsisFull;
      if (item.descFull && !item.desc) item.desc = item.descFull;
      if (item.thumb && /\.\.\/assets\/images\/[^/]+\.(png|jpg|jpeg|webp)/i.test(item.thumb)) {
        item.thumb = item.thumb.replace('../assets/images/', `../assets/images/${subfolder}/`);
      }
      if (item.thumb) item.thumb = item.thumb.replace(/^\.\.\/assets\//, 'assets/');
      return item;
    });
    return { film: fixPath(parsed.film, 'posters'), book: fixPath(parsed.book, 'books') };
  }

  let _cachedWorks = null;
  let _cachedCols  = {};

  function loadWorksData() {
    if (_cachedWorks) return _cachedWorks;
    try {
      const saved = localStorage.getItem('worksData');
      if (saved) return fixWorksData(JSON.parse(saved));
    } catch(e) {}
    return DEFAULT_WORKS;
  }

  async function loadWorksDataCloud() {
    try {
      if (window.sbLoad) {
        const data = await sbLoad('worksData', null);
        if (data && (data.film || data.book)) return fixWorksData(data);
      }
    } catch(e) {}
    return loadWorksData();
  }

  /* ===== RENDER GRID ===== */
  function renderGrid(tab) {
    const data = loadWorksData();
    const items = data[tab] || [];
    const grid = document.getElementById('cardGrid');
    const ratioClass = tab === 'film' ? 'ratio-film' : 'ratio-book';
    const icon = tab === 'film' ? '?렗' : '?뱴';

    // CSS grid columns from admin config
    const colsKey = tab === 'film' ? 'worksColsFilm' : 'worksColsBook';
    const cols = parseInt(_cachedCols[colsKey] ?? localStorage.getItem(colsKey) ?? '4');
    grid.className = 'card-grid';
    grid.style.setProperty('--grid-cols', cols);
    grid.style.setProperty('--card-w', `calc((100% - ${(cols - 1) * 10}px) / ${cols})`);

    grid.innerHTML = items.map(item => `
      <div class="work-card ${selectedId === item.id ? 'active' : ''}"
           data-id="${item.id}"
           data-type="${tab}"
           onclick="selectWork('${item.id}', '${tab}')">
        <div class="card-img-wrap ${ratioClass}">
          ${item.thumb
            ? `<img src="${item.thumb}" alt="${item.title}" loading="lazy">`
            : `<span class="card-thumb-icon">${icon}</span>`
          }
          ${item.badge ? `<span class="card-badge">${item.badge}</span>` : (tab === 'book' ? `<span class="card-badge">?뱰 ${item.year}</span>` : '')}
        </div>
      </div>
    `).join('');
  }

    }
  };

  async function updateWorksMsg(tab) {
    const key = tab === 'film' ? 'pageMsgWorksFilm' : 'pageMsgWorksBook';
    const def = WORKS_MSG_DEF[tab] || {};
    try {
      const cfg = window.sbLoad
        ? await sbLoad(key, {})
        : JSON.parse(localStorage.getItem(key) || '{}');
      const textEl = document.querySelector('.works-msg .message-box-text');
      const subEl  = document.querySelector('.works-msg .message-box-sub');
      if (textEl) textEl.innerHTML = cfg.mainMsg  ? cfg.mainMsg.replace(/\n/g,'<br>')  : (def.mainMsg  || '');
      if (subEl)  subEl.innerHTML  = cfg.subtitle ? cfg.subtitle.replace(/\n/g,'<br>') : (def.subtitle || '');
    } catch(e) {
      const textEl = document.querySelector('.works-msg .message-box-text');
      const subEl  = document.querySelector('.works-msg .message-box-sub');
      if (textEl) textEl.innerHTML = def.mainMsg  || '';
      if (subEl)  subEl.innerHTML  = def.subtitle || '';
    }
  }

  /* ===== SWITCH TAB ===== */
  function switchTab(tab) {
    currentTab = tab;
    selectedId = null;
    savedWorkCardEl = null;
    savedWorkCardHtml = null;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    const zoomLayer = document.getElementById('worksZoomLayer');
    if (zoomLayer) zoomLayer.classList.remove('active');
    updateWorksMsg(tab);
    renderGrid(tab);
    showPanelEmpty();
  }

  /* ===== SELECT WORK: 媛뺤쓽(openLecDetail) ?⑦꽩 ?꾩쟾 ?숈씪 ===== */
  function selectWork(id, tab) {
    selectedId = id;
    const data = loadWorksData();
    const item = (data[tab] || []).find(i => i.id === id);
    if (!item) return;

    // 1) 以??덉씠???쒖꽦??(?대?吏 議댁옱 ?щ? ?ъ쟾 ?뺤씤)
    const zoomLayer = document.getElementById('worksZoomLayer');
    const zoomImg = document.getElementById('worksZoomImg');
    if (zoomLayer && zoomImg) {
      if (item.thumb) {
        const testImg = new Image();
        testImg.onload = () => {
          zoomImg.style.backgroundImage = 'url("' + item.thumb + '")';
          zoomLayer.classList.add('active');
        };
        testImg.onerror = () => {
          zoomImg.style.backgroundImage = '';
          zoomLayer.classList.remove('active');
        };
        testImg.src = item.thumb;
      } else {
        zoomImg.style.backgroundImage = '';
        zoomLayer.classList.remove('active');
      }
    }

    // 2) ?댁쟾 X 移대뱶 蹂듭썝 ????移대뱶 X濡?援먯껜 (?щ젋?붾쭅 ?놁씠)
    if (savedWorkCardEl && savedWorkCardHtml) {
      savedWorkCardEl.classList.remove('selected-placeholder', 'active');
      savedWorkCardEl.innerHTML = savedWorkCardHtml;
      savedWorkCardEl = null;
      savedWorkCardHtml = null;
    }
    const activeCard = document.querySelector('.work-card[data-id="' + id + '"]');
    if (activeCard) {
      savedWorkCardEl   = activeCard;
      savedWorkCardHtml = activeCard.innerHTML;
      const ratioClass = tab === 'film' ? 'ratio-film' : 'ratio-book';
      activeCard.classList.add('selected-placeholder');
      activeCard.innerHTML = '<div class="card-img-wrap ' + ratioClass + '"><div class="work-card-x">??/div></div>';
    }

    // 3) ?곗륫 ?⑤꼸
    showPanelDetail(item, tab);
  }

  function closeWorksZoom() {
    const zoomLayer = document.getElementById('worksZoomLayer');
    if (zoomLayer) zoomLayer.classList.remove('active');
    selectedId = null;
    /* 移대뱶 蹂듭썝 ???꾩껜 ?щ젋?붾쭅 ?놁씠 ?대떦 移대뱶留?蹂듭썝 */
    if (savedWorkCardEl && savedWorkCardHtml) {
      savedWorkCardEl.classList.remove('selected-placeholder', 'active');
      savedWorkCardEl.innerHTML = savedWorkCardHtml;
      savedWorkCardEl = null;
      savedWorkCardHtml = null;
    }
    showPanelEmpty();
  }

  /* ===== PANEL ===== */
  function showPanelDetail(item, tab) {
    document.getElementById('panelEmpty').style.display = 'none';
    const detail = document.getElementById('panelDetail');
    detail.style.display = 'flex';

    document.getElementById('detailTag').textContent =
      tab === 'film' ? `AI ?곹솕 쨌 ${item.year}` : `?꾩꽌 쨌 ${item.year}`;

    const titleEl = document.getElementById('detailTitle');
    if (tab === 'film' && item.titleEn && item.titleEn !== item.title) {
      titleEl.innerHTML = `${item.title} <span style="font-size:16px;font-weight:400;color:var(--text-secondary);font-style:italic;">${item.titleEn}</span>`;
    } else {
      titleEl.textContent = item.title;
    }

    document.getElementById('detailYear').textContent =
      tab === 'film' ? `?쒖옉?곕룄: ${item.year}` : `異쒗뙋?곕룄: ${item.year}`;

    const awardsEl = document.getElementById('detailAwards');
    if (tab === 'film' && item.awards?.length) {
      awardsEl.style.display = 'flex';
      awardsEl.innerHTML = item.awards.map(a => {
        const text = typeof a === 'string' ? a : `${a.emoji} ${a.text}`;
        return `<div class="award-item"><span class="award-dot"></span><span>${text}</span></div>`;
      }).join('');
    } else {
      awardsEl.style.display = 'none';
    }

    const synopsisEl = document.getElementById('detailSynopsis');
    const paragraphs = tab === 'film' ? item.synopsisFull : item.descFull;
    if (paragraphs?.length) {
      synopsisEl.style.display = 'flex';
      synopsisEl.innerHTML = paragraphs.map(p => `<p>${p}</p>`).join('');
    } else {
      synopsisEl.style.display = 'none';
    }

    const infoEl = document.getElementById('detailInfo');
    if (item.info?.length) {
      infoEl.style.display = 'flex';
      infoEl.innerHTML = item.info.map(i => `<div class="detail-info-item">${i}</div>`).join('');
    } else {
      infoEl.style.display = 'none';
    }

    const linksEl = document.getElementById('detailLinks');
    if (item.links?.length) {
      linksEl.style.display = 'flex';
      linksEl.innerHTML = item.links.map(l =>
        `<a class="detail-link-btn" href="${l.url}" target="_blank" rel="noopener">??${l.label}</a>`
      ).join('');
    } else {
      linksEl.style.display = 'none';
    }

    document.getElementById('detailDesc').style.display = 'none';
  }

  function showPanelEmpty() {
    document.getElementById('panelEmpty').style.display = 'flex';
    document.getElementById('panelDetail').style.display = 'none';
  }

  async function initWorksPage() {
    [_cachedWorks, _cachedCols['worksColsFilm'], _cachedCols['worksColsBook']] = await Promise.all([
      loadWorksDataCloud(),
      window.sbLoad ? sbLoad('worksColsFilm', 4) : Promise.resolve(parseInt(localStorage.getItem('worksColsFilm') || '4')),
      window.sbLoad ? sbLoad('worksColsBook', 4)  : Promise.resolve(parseInt(localStorage.getItem('worksColsBook')  || '4')),
    ]);
    currentTab = 'film';
    selectedId = null;
    await updateWorksMsg('film');
    renderGrid('film');
    showPanelEmpty();
  }

  /* ===== window exports (HTML onclick ?곌껐) ===== */
  window.switchTab       = switchTab;
  window.selectWork      = selectWork;
  window.closeWorksZoom  = closeWorksZoom;
  window.initWorksPage   = initWorksPage;

  if (document.getElementById('cardGrid')) initWorksPage();
})();
