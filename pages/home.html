<section class="home-section">

  <!-- 전체 배경 슬라이드쇼 -->
  <div class="slideshow-container" id="homeSlideshowContainer">
    <!-- slides injected by JS -->
    <div class="slide-overlay"></div>
    <button class="prev-btn" aria-label="이전 슬라이드">&#10094;</button>
    <button class="next-btn" aria-label="다음 슬라이드">&#10095;</button>
    <div class="dots-container" id="homeDotsContainer"></div>
    <div class="message-box">
      <div class="message-box-text">
        AI를 활용해 더 나은 미래를 만드는<br>
        <strong>생성형 AI 강사 유형재</strong>입니다
      </div>
      <div class="message-box-rating">
        <span class="stars">★★★★★</span>
        <span>4.9 · 700+ 수강생이 선택한 실무 중심 AI 강의</span>
      </div>
    </div>
  </div>

  <!-- 우측 사이드 패널 (Gusto 스타일) -->
  <div class="desktop-side-panel">
    <!-- side cards injected by JS -->
  </div>

</section>

<style>
  /* ===== 홈 섹션 ===== */
  .home-section {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;
  }

  /* ===== 슬라이드쇼 ===== */
  .slideshow-container {
    position: absolute;
    top: 0;
    left: 0;
    right: 50px;   /* 우측 50px 축소 */
    bottom: 0;
    overflow: hidden;
    z-index: 1;
  }

  .slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }

  .slide.active {
    opacity: 1;
    pointer-events: auto;
  }

  .slide img {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  /* 반투명 오버레이 */
  .slide-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: transparent;
    z-index: 2;
  }

  /* 화살표 */
  .prev-btn, .next-btn {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(4px);
    color: #fff;
    border: none;
    font-size: 22px;
    padding: 12px 16px;
    cursor: pointer;
    z-index: 10;
    border-radius: 4px;
    transition: all 0.3s ease;
  }
  .prev-btn { left: 20px; }
  .next-btn { right: calc(var(--panel-width) + 10px); }
  .prev-btn:hover, .next-btn:hover { background: rgba(0,0,0,0.7); color: #c9a96e; }

  /* 점 인디케이터 */
  .dots-container {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
  }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.6);
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .dot.active {
    background: #c9a96e;
    border-color: #c9a96e;
    width: 26px;
    border-radius: 5px;
  }

  /* 하단 중앙 메시지 박스 */
  .message-box {
    position: absolute;
    bottom: 20px;
    left: 32px;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 16px 24px;
    width: 500px;
    z-index: 10;
    text-align: left;
  }

  .message-box-text {
    font-size: 20px;
    line-height: 1.65;
    color: #fff;
    margin-bottom: 8px;
  }

  .message-box-rating {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: rgba(255,255,255,0.7);
  }

  .stars { color: #c9a96e; }

  /* ===== 우측 사이드 패널 ===== */
  .desktop-side-panel {
    position: absolute;
    right: 0;
    top: var(--header-height);
    width: var(--panel-width);
    bottom: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 8px;
    background: #0d0d0d;
    z-index: 200;
    overflow: hidden;
    box-sizing: border-box;
  }

  /* 카드 — 높이는 grid 1fr이 결정 */
  .side-card {
    position: relative;
    width: 100%;
    min-height: 0;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  /* 첫 번째 카드(강사) 전체 너비 */
  .side-card:first-child {
    grid-column: 1 / -1;
  }

  /* 마지막 카드가 혼자 남는 경우(짝수 번째) 전체 너비 차지 */
  .side-card:last-child:nth-child(even) {
    grid-column: 1 / -1;
  }

  .side-card:hover {
    transform: scale(1.02);
  }

  .side-card > img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }

  .side-card:hover > img {
    transform: scale(1.08);
  }

  /* 카드 위 어두운 그라데이션 오버레이 */
  .side-card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.1) 0%,
      rgba(0,0,0,0.5) 100%
    );
    transition: background 0.3s ease;
  }

  .side-card:hover .side-card-overlay {
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.05) 0%,
      rgba(0,0,0,0.35) 100%
    );
  }

  /* 작업중 배지 */
  .side-card-wip {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(10,10,10,0.78);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(201,169,110,0.6);
    color: #c9a96e;
    font-size: 12px;
    font-weight: 600;
    font-family: 'Poppins', 'SUITE', sans-serif;
    padding: 6px 14px;
    border-radius: 999px;
    white-space: nowrap;
    pointer-events: none;
  }

  /* 텍스트 레이블 - 좌하단 */
  .side-card-label {
    position: absolute;
    bottom: 14px;
    left: 16px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Poppins', 'SUITE', sans-serif;
    font-style: normal;
    letter-spacing: 0.3px;
    z-index: 5;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }

  /* ===== 랜딩 클릭 힌트 (데스크탑) ===== */
  .side-hint-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(10,10,10,0.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(201,169,110,0.55);
    border-radius: 20px;
    padding: 7px 15px 7px 12px;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    font-family: 'Poppins', 'SUITE', sans-serif;
    color: rgba(255,255,255,0.92);
    white-space: nowrap;
    pointer-events: none;
    z-index: 300;
    opacity: 0;
    animation: hintFadeIn 0.4s ease 0.6s forwards;
  }

  .side-hint-overlay.blinking {
    animation: hintFadeIn 0.4s ease 0.6s forwards, hintBlink 0.7s ease-in-out 1s infinite;
  }

  .side-hint-overlay.hiding {
    animation: hintFadeOut 0.35s ease forwards !important;
  }

  .hint-hand-icon {
    flex-shrink: 0;
    animation: hintTap 0.8s ease-in-out infinite;
  }

  @keyframes hintFadeIn {
    from { opacity: 0; transform: translate(-50%, -46%); }
    to   { opacity: 1; transform: translate(-50%, -50%); }
  }

  @keyframes hintFadeOut {
    from { opacity: 1; transform: translate(-50%, -50%); }
    to   { opacity: 0; transform: translate(-50%, -54%); }
  }

  @keyframes hintBlink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.15; }
  }

  @keyframes hintTap {
    0%, 100% { transform: translateY(0) rotate(0deg);   }
    40%       { transform: translateY(-3px) rotate(-6deg); }
  }

  /* 모바일 */
  @media (max-width: 900px) {
    .desktop-side-panel { display: none; }
    .next-btn { right: 20px; }
    .message-box { left: 16px; right: 16px; bottom: 16px; width: auto; }
    .prev-btn { left: 10px; }
  }
</style>

<script>
  async function initHomePage() {
    const DEFAULT_SLIDES_WEB = [
      'assets/images/lectures/main1.png',
      'assets/images/lectures/main5.png',
      'assets/images/lectures/main4.png',
      'assets/images/lectures/main3.png'
    ];
    const DEFAULT_PANELS_WEB = [
      { label: '강사',    nav: 'about',    path: 'assets/images/instructor1.png' },
      { label: '강의',    nav: 'lectures', path: 'assets/images/lectures/main6.png' },
      { label: '작업들',  nav: 'works',    path: 'assets/images/posters/Jeong Poster.png' },
      { label: '문의',    nav: 'contact',  path: 'assets/images/lectures/main3.png' },
      { label: '프롬프트', nav: 'prompts',  path: 'assets/images/prompt.png' },
      { label: 'M/V',    nav: 'mv',       path: 'assets/images/mv/@Korisian.png' }
    ];

    function toWebPath(p) { return p ? p.replace(/^\.\.\//, '') : p; }

    /* 슬라이드 로드 (Supabase → localStorage 폴백) */
    let slidePaths = DEFAULT_SLIDES_WEB;
    try {
      const raw = window.sbLoad
        ? await sbLoad('landingSlides', null)
        : JSON.parse(localStorage.getItem('landingSlides') || 'null');
      if (raw && Array.isArray(raw) && raw.length) slidePaths = raw.map(toWebPath);
    } catch(e) {}

    /* 사이드 패널 로드 */
    let panels = DEFAULT_PANELS_WEB;
    try {
      const raw = window.sbLoad
        ? await sbLoad('landingSidePanels', null)
        : JSON.parse(localStorage.getItem('landingSidePanels') || 'null');
      if (raw && Array.isArray(raw) && raw.length) panels = raw.map(p => ({ ...p, path: toWebPath(p.path) }));
    } catch(e) {}

    /* homeConfig 로드 */
    let cfg = {};
    try {
      cfg = window.sbLoad
        ? await sbLoad('homeConfig', {})
        : JSON.parse(localStorage.getItem('homeConfig') || '{}');
    } catch(e) {}

    /* 슬라이드 DOM 주입 */
    const container = document.getElementById('homeSlideshowContainer');
    const dotsEl    = document.getElementById('homeDotsContainer');
    if (!container) return;
    container.querySelectorAll('.slide').forEach(s => s.remove());
    dotsEl.innerHTML = '';
    const overlay = container.querySelector('.slide-overlay');

    slidePaths.forEach((src, i) => {
      const div = document.createElement('div');
      div.className = 'slide' + (i === 0 ? ' active' : '');
      div.innerHTML = `<img src="${src}" alt="슬라이드 ${i+1}">`;
      container.insertBefore(div, overlay);
    });
    slidePaths.forEach((_, i) => {
      const span = document.createElement('span');
      span.className = 'dot' + (i === 0 ? ' active' : '');
      span.dataset.slide = i;
      dotsEl.appendChild(span);
    });

    /* 슬라이드쇼 로직 */
    const slides = container.querySelectorAll('.slide');
    const dots   = dotsEl.querySelectorAll('.dot');
    const prevBtn = container.querySelector('.prev-btn');
    const nextBtn = container.querySelector('.next-btn');
    let current = 0, timer = null;
    const INTERVAL = 3000;

    function showSlide(n) {
      if (n >= slides.length) current = 0;
      else if (n < 0) current = slides.length - 1;
      else current = n;
      slides.forEach(s => s.classList.remove('active'));
      dots.forEach(d => d.classList.remove('active'));
      slides[current].classList.add('active');
      if (dots[current]) dots[current].classList.add('active');
    }
    function startTimer() { timer = setInterval(() => showSlide(current + 1), INTERVAL); }
    function resetTimer() { clearInterval(timer); startTimer(); }

    if (prevBtn) prevBtn.addEventListener('click', () => { showSlide(current - 1); resetTimer(); });
    if (nextBtn) nextBtn.addEventListener('click', () => { showSlide(current + 1); resetTimer(); });
    dots.forEach((dot, i) => dot.addEventListener('click', () => { showSlide(i); resetTimer(); }));
    container.addEventListener('mouseenter', () => clearInterval(timer));
    container.addEventListener('mouseleave', startTimer);

    /* 모든 슬라이드 이미지 프리로드 후 시작 → 첫 루프부터 균일한 전환 */
    let loaded = 0;
    const total = slidePaths.length;
    function onImgReady() {
      if (++loaded >= total) { showSlide(0); startTimer(); }
    }
    slidePaths.forEach(src => {
      const img = new Image();
      img.onload = img.onerror = onImgReady;
      img.src = src;
    });

    /* 사이드 패널 렌더 */
    const sidePanel = document.querySelector('.desktop-side-panel');
    if (sidePanel) {
      sidePanel.querySelectorAll('.side-card').forEach(c => c.remove());
      const rowCount = 1 + Math.ceil((panels.length - 1) / 2);
      sidePanel.style.gridTemplateRows = `repeat(${rowCount}, 1fr)`;
      panels.forEach((panel, idx) => {
        const card = document.createElement('div');
        card.className = 'side-card';
        card.onclick = () => {
          /* 힌트 즉시 숨기고 다시 안 보이게 */
          const h = card.querySelector('.side-hint-overlay');
          if (h) { h.classList.add('hiding'); setTimeout(() => h.remove(), 350); }
          sessionStorage.setItem('sideHintDone', '1');
          navigateTo(panel.nav);
        };
        const isWip = ['prompts'].includes(panel.nav);
        card.innerHTML = `
          <img src="${panel.path}" alt="${panel.label}" onerror="this.style.display='none'">
          <div class="side-card-overlay"></div>
          <span class="side-card-label">${panel.label}</span>
          ${isWip ? '<span class="side-card-wip">🚧 작업중</span>' : ''}
        `;
        /* 첫 번째 카드에만 힌트 표시 (세션 중 한 번만) */
        if (idx === 0 && !sessionStorage.getItem('sideHintDone')) {
          const hint = document.createElement('div');
          hint.className = 'side-hint-overlay blinking';
          hint.innerHTML = `
            <svg class="hint-hand-icon" width="11" height="14" viewBox="0 0 22 28" fill="none">
              <path d="M10 0C8.9 0 8 .9 8 2v10.3A5 5 0 0 0 1 17.2V18c0 5.5 4.5 10 10 10h1.4A9 9 0 0 0 22 19v-2c0-1.1-.9-2-2-2s-2 .9-2 2v-2c0-1.1-.9-2-2-2s-2 .9-2 2v-1c0-1.1-.9-2-2-2s-2 .9-2 2V2C10 .9 9.1 0 8 0h2z" fill="rgba(255,255,255,0.92)"/>
            </svg>
            <span>사진 클릭 → 상세보기</span>
          `;
          card.appendChild(hint);
          /* 3초 후 자동 사라짐 */
          setTimeout(() => {
            hint.classList.add('hiding');
            sessionStorage.setItem('sideHintDone', '1');
            setTimeout(() => hint.remove(), 350);
          }, 3600);
        }
        sidePanel.appendChild(card);
      });
    }

    /* 메시지 적용 */
    const msgEl    = document.querySelector('.message-box-text');
    const starsEl  = document.querySelector('.message-box-rating .stars');
    const ratingEl = document.querySelector('.message-box-rating span:last-child');
    if (msgEl) {
      const main = cfg.mainMsg || cfg.message || '';
      const sub  = cfg.subtitle || '';
      if (main) {
        msgEl.innerHTML = main.replace(/\n/g, '<br>')
          + (sub ? `<br><span style="font-size:0.75em; opacity:0.75; font-weight:400;">${sub.replace(/\n/g,'<br>')}</span>` : '');
      }
    }
    if (cfg.stars  && starsEl)  starsEl.textContent  = cfg.stars;
    if (cfg.rating && ratingEl) ratingEl.textContent = cfg.rating;
  }

  initHomePage();
</script>
