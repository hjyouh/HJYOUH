  <script>
    // ===== 작업중 토스트 =====
    function showMobileWip() {
      const ex = document.getElementById('mobile-wip-toast');
      if (ex) ex.remove();
      const el = document.createElement('div');
      el.id = 'mobile-wip-toast';
      el.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);'
        + 'background:rgba(10,10,10,0.88);backdrop-filter:blur(16px);'
        + 'border:1px solid rgba(201,169,110,0.55);border-radius:18px;'
        + 'padding:24px 36px;text-align:center;z-index:9999;pointer-events:none;'
        + "font-family:'Poppins','SUITE',sans-serif;";
      el.innerHTML = '<div style="font-size:28px;margin-bottom:8px">🚧</div>'
        + '<div style="font-size:16px;font-weight:700;color:#c9a96e">작업 중입니다</div>'
        + '<div style="font-size:12px;color:rgba(255,255,255,0.45);margin-top:5px">준비 중인 페이지입니다</div>';
      document.body.appendChild(el);
      setTimeout(() => { el.style.transition='opacity 0.4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),420); }, 2200);
    }

    // ===== 홈 Mobile Message 연동 =====
    (function() {
      try {
        const cfg = JSON.parse(localStorage.getItem('homeConfig') || '{}');
        const el = document.getElementById('homeTopMsg');
        if (el && cfg.mobile) el.textContent = cfg.mobile;
      } catch(e) {}
    })();

    // ===== 랜딩 카드 이미지 admin 연동 =====
    // nav → cardImg id 매핑
    const NAV_TO_CARD = { about: 'cardImg2', lectures: 'cardImg3', works: 'cardImg4', prompts: 'cardImg5', mv: 'cardImg6' };
    function applyPanelImages(panels) {
      if (!Array.isArray(panels)) return;
      panels.forEach(function(p) {
        const imgId = NAV_TO_CARD[p.nav];
        if (!imgId || !p.path) return;
        const el = document.getElementById(imgId);
        if (!el) return;
        // path가 assets/... 형태면 ../../ 접두어 붙임
        const href = p.path.startsWith('http') ? p.path
          : '../../' + p.path.replace(/^(\.\.\/)*/, '');
        el.setAttribute('href', href);
      });
    }
    (function() {
      try {
        const raw = localStorage.getItem('landingSidePanels');
        if (raw) applyPanelImages(JSON.parse(raw));
      } catch(e) {}
      // Supabase 연동 (로드 후 시도)
      window.addEventListener('load', function() {
        try {
          if (window.sbLoad) {
            window.sbLoad('landingSidePanels', null).then(function(data) {
              if (data) applyPanelImages(data);
            }).catch(function(){});
          }
        } catch(e) {}
      });
    })();

    // ===== 슬라이드 (rAF + SVG transform attribute — SVG 유저 유닛 기준) =====
    let current = 0;
    let currentX = 0;
    let animating = false;
    const total = 4;
    const slideW = 360; // SVG viewBox 폭과 동일

    function animateTo(targetX) {
      const startX = currentX;
      const startTime = performance.now();
      const duration = 480;
      animating = true;

      function step(now) {
        const t = Math.min((now - startTime) / duration, 1);
        const ease = 1 - Math.pow(1 - t, 3); // ease-out cubic
        const x = startX + (targetX - startX) * ease;
        document.getElementById('slideTrack')
          .setAttribute('transform', 'translate(' + x + ',0)');
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          currentX = targetX;
          animating = false;
        }
      }
      requestAnimationFrame(step);
    }

    function goSlide(n) {
      if (animating) return;
      current = (n + total) % total;
      animateTo(-slideW * current);
      ['dot0','dot1','dot2','dot3'].forEach((id, i) => {
        document.getElementById(id)
          .setAttribute('fill', i === current ? '#ffffff' : '#555555');
      });
    }
    function prevSlide() { goSlide(current - 1); }
    function nextSlide() { goSlide(current + 1); }
    setInterval(() => goSlide(current + 1), 4000);

    // ===== 스크롤바 =====
    let scrollTimer;
    document.addEventListener('scroll', function() {
      document.body.classList.add('is-scrolling');
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(function() {
        document.body.classList.remove('is-scrolling');
      }, 800);
    });

    // ===== 스크롤 탭 힌트 (1회만 표시) =====
    (function() {
      if (sessionStorage.getItem('tapHintShown')) return;
      var triggered = false;
      function onScroll() {
        if (triggered || window.scrollY < 180) return;
        triggered = true;
        sessionStorage.setItem('tapHintShown', '1');
        window.removeEventListener('scroll', onScroll);
        var hint = document.getElementById('scrollTapHint');
        hint.classList.add('visible');
        // 2.5초 후 페이드 아웃
        setTimeout(function() {
          hint.style.transition = 'opacity 0.6s ease';
          hint.style.opacity = '0';
        }, 2500);
      }
      window.addEventListener('scroll', onScroll, { passive: true });
    })();
  </script>
