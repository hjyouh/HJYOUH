<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 로그인</title>
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #f4f5f7;
      --bg2:    #ffffff;
      --border: #e0e0e0;
      --text:   #222222;
      --sub:    #777777;
      --gold:   #b89355;
      --gold2:  rgba(184,147,85,0.12);
      --red:    #d32f2f;
    }

    body {
      font-family: 'Poppins', 'SUITE', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ── 배경 장식 ── */
    body::before {
      content: '';
      position: fixed;
      top: -30%; left: -20%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(184,147,85,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
      position: relative;
    }

    /* ── 로고 영역 ── */
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px; height: 56px;
      border-radius: 16px;
      background: var(--gold);
      color: #fff;
      font-size: 26px;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(184,147,85,0.35);
    }
    .login-logo-text {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .login-logo-sub {
      font-size: 13px;
      color: var(--sub);
      margin-top: 4px;
    }

    /* ── 카드 ── */
    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px 32px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.07);
    }

    .login-card h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .login-card p {
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 28px;
    }

    /* ── 입력 필드 ── */
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--sub);
      margin-bottom: 7px;
      letter-spacing: 0.3px;
    }
    .field-inner {
      position: relative;
    }
    .field-inner .field-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
    }
    .field input {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 11px 14px 11px 42px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(184,147,85,0.12);
      background: var(--bg2);
    }
    .field input::placeholder { color: #bbb; }

    /* 비밀번호 토글 */
    .pw-toggle {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer; font-size: 16px;
      color: var(--sub); line-height: 1;
      padding: 2px;
    }
    .pw-toggle:hover { color: var(--text); }

    /* ── 자동 로그인 + 비밀번호 분실 ── */
    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 22px;
    }
    .auto-login {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-size: 13px;
      color: var(--sub);
      user-select: none;
    }
    .auto-login input[type=checkbox] {
      width: 16px; height: 16px;
      accent-color: var(--gold);
      cursor: pointer;
    }
    .forgot-link {
      font-size: 13px;
      color: var(--gold);
      text-decoration: none;
    }
    .forgot-link:hover { text-decoration: underline; }

    /* ── 로그인 버튼 ── */
    .login-btn {
      width: 100%;
      padding: 13px;
      background: var(--gold);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(184,147,85,0.3);
      letter-spacing: 0.3px;
    }
    .login-btn:hover  { background: #a6844b; box-shadow: 0 6px 18px rgba(184,147,85,0.4); }
    .login-btn:active { transform: scale(0.98); }

    /* ── 에러 메시지 ── */
    .err-msg {
      background: rgba(211,47,47,0.08);
      border: 1px solid rgba(211,47,47,0.25);
      border-radius: 8px;
      color: var(--red);
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: none;
    }
    .err-msg.show { display: block; }

    /* ── 홈 링크 ── */
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--sub);
    }
    .login-footer a { color: var(--gold); text-decoration: none; }
    .login-footer a:hover { text-decoration: underline; }

    /* ── 힌트 박스 (초기 설치용) ── */
    .hint-box {
      background: var(--gold2);
      border: 1px solid rgba(184,147,85,0.25);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 12px;
      color: #8a6d3b;
      margin-top: 20px;
      line-height: 1.7;
    }
    .hint-box strong { color: var(--gold); }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-logo">
    <div class="login-logo-mark">✦</div>
    <div class="login-logo-text">유형재 관리자 패널</div>
    <div class="login-logo-sub">AI Instructor Admin</div>
  </div>

  <div class="login-card">
    <div style="display:flex; align-items:baseline; gap:10px; margin-bottom:28px;">
      <h2 style="margin:0; font-size:18px;">로그인</h2>
      <p style="margin:0; font-size:13px;">관리자 계정으로 로그인하세요</p>
    </div>

    <div class="err-msg" id="errMsg">아이디 또는 비밀번호가 일치하지 않습니다.</div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;">
      <div class="field" style="margin-bottom:0;">
        <label>로그인 아이디</label>
        <div class="field-inner">
          <span class="field-icon">👤</span>
          <input type="text" id="loginId" placeholder="아이디 입력" autocomplete="username">
        </div>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>비밀번호</label>
        <div class="field-inner">
          <span class="field-icon">🔒</span>
          <input type="password" id="loginPw" placeholder="비밀번호 입력" autocomplete="current-password">
          <button type="button" class="pw-toggle" id="pwToggle" onclick="togglePw()">👁</button>
        </div>
      </div>
    </div>

    <div class="login-options">
      <label class="auto-login">
        <input type="checkbox" id="autoLogin"> 자동 로그인
      </label>
      <a href="reset.html" class="forgot-link">비밀번호를 잊었나요?</a>
    </div>

    <button class="login-btn" onclick="doLogin()">로그인</button>
  </div>

  <div class="hint-box" id="hintBox" style="display:none;">
    <strong>초기 관리자 계정</strong><br>
    아이디: <strong>admin</strong> &nbsp;/&nbsp; 비밀번호: <strong>admin1234</strong><br>
    로그인 후 비밀번호를 변경해주세요.
  </div>

  <div class="login-footer">
    <a href="../index.html" target="_blank">← 홈페이지로 이동</a>
  </div>
</div>

<script src="admin-auth.js?v=2"></script>
<script>
  // 이미 로그인 중이면 대시보드로
  if (getSession()) window.location.href = 'home.html';

  // 초기 설치 힌트 (로그인 시도 전 localStorage에 users 없으면 표시)
  if (!localStorage.getItem('adminUsers')) {
    document.getElementById('hintBox').style.display = 'block';
  }

  // Enter 키 지원
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  function doLogin() {
    const id   = document.getElementById('loginId').value.trim();
    const pw   = document.getElementById('loginPw').value;
    const auto = document.getElementById('autoLogin').checked;
    const err  = document.getElementById('errMsg');

    if (!id || !pw) { err.textContent = '아이디와 비밀번호를 모두 입력해주세요.'; err.classList.add('show'); return; }

    const session = authLogin(id, pw, auto);
    if (!session) {
      err.textContent = '아이디 또는 비밀번호가 일치하지 않습니다.';
      err.classList.add('show');
      document.getElementById('loginPw').value = '';
      return;
    }
    err.classList.remove('show');
    window.location.href = 'home.html';
  }

  function togglePw() {
    const inp = document.getElementById('loginPw');
    const btn = document.getElementById('pwToggle');
    if (inp.type === 'password') { inp.type = 'text';     btn.textContent = '🙈'; }
    else                         { inp.type = 'password'; btn.textContent = '👁'; }
  }
</script>
</body>
</html>
