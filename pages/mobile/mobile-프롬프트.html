<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"></noscript>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프롬프트 모음 - aimt</title>
  <link rel="stylesheet" href="../../assets/css/tab-card.css?v=3">
  <link rel="stylesheet" href="../../assets/css/fonts.css?v=3">
  <link rel="stylesheet" href="../../assets/css/mobile-frame.css?v=3">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      font-family: 'Poppins', 'SUITE', sans-serif;
      color: #fff;
      overflow-y: scroll;
      padding-bottom: 80px;
      max-width: 430px;
      margin: 0 auto;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* ===== HEADER ===== */
    .top-fixed-wrapper {
      position: sticky;
      top: 0;
      z-index: 110;
      background: #0d0d0d;
    }

    .header {
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 44px;
      border-bottom: 1px solid #2a2a2a;
      position: relative;
    }

    .header-back {
      font-size: 22px;
      color: rgba(255,255,255,0.55);
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
      padding: 4px 0;
    }

    .header-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
    }

    /* ===== SEGMENT TABS ===== */
    .tabs-wrap {
      display: flex;
      justify-content: center;
      padding: 12px 16px;
      background: #0d0d0d;
    }

    .tab-segmented {
      display: flex;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 999px;
      overflow: hidden;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.4);
      font-family: 'Poppins', 'SUITE', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 22px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn + .tab-btn { border-left: 1px solid rgba(255,255,255,0.18); }
    .tab-btn.active { color: #c9a96e; font-weight: 700; background: rgba(255,255,255,0.07); }

    /* ===== MASONRY GRID (2 columns) ===== */
    .prompts-masonry {
      columns: 2;
      column-gap: 8px;
      padding: 4px 10px 20px;
    }

    /* ===== PROMPT CARD ===== */
    .prompt-card {
      break-inside: avoid;
      margin-bottom: 8px;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      border: 1.5px solid transparent;
      transition: border-color 0.2s ease;
      display: block;
    }

    .prompt-card img {
      width: 100%;
      display: block;
      border-radius: 9px;
    }

    .prompt-card.active {
      border-color: #c9a96e;
    }

    .prompt-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.6) 100%);
      border-radius: 9px;
    }

    .prompt-card-tool {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 9px;
      color: rgba(255,255,255,0.7);
    }

    .prompt-card-label {
      position: absolute;
      bottom: 7px;
      left: 8px;
      right: 8px;
      font-size: 10px;
      font-weight: 500;
      color: rgba(255,255,255,0.88);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .prompt-card {
      animation: fadeUp 0.4s ease both;
    }

    /* ===== MODAL OVERLAY ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 200;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }

    .modal-overlay.open { display: flex; }

    .modal-header {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      gap: 12px;
      background: rgba(13,13,13,0.95);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .modal-close-btn {
      background: rgba(255,255,255,0.08);
      border: none;
      color: rgba(255,255,255,0.7);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-title-text {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-tool-badge {
      background: rgba(201,169,110,0.15);
      border: 1px solid rgba(201,169,110,0.35);
      color: #c9a96e;
      font-size: 10px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .modal-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-img-wrap img {
      width: 100%;
      display: block;
      border-radius: 12px;
      max-height: 55vh;
      object-fit: cover;
    }

    .modal-prompt-area {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .prompt-copy-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .prompt-label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .prompt-copy-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(201,169,110,0.12);
      border: 1px solid rgba(201,169,110,0.3);
      color: #c9a96e;
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .prompt-copy-btn:active { opacity: 0.7; }

    .prompt-copy-btn.copied {
      background: rgba(100,200,150,0.15);
      border-color: rgba(100,200,150,0.4);
      color: #6dc;
    }

    .prompt-textarea {
      width: 100%;
      min-height: 140px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: rgba(255,255,255,0.82);
      font-family: 'Poppins', 'SUITE', monospace;
      font-size: 12px;
      line-height: 1.7;
      padding: 12px;
      resize: vertical;
      outline: none;
      cursor: text;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="top-fixed-wrapper">
    <div class="header">
      <button class="header-back" onclick="history.back()">‹</button>
      <span class="header-title">프롬프트 모음</span>
    </div>

    <!-- Tabs -->
    <div class="tabs-wrap">
      <div class="tab-segmented">
        <button class="tab-btn active" data-tab="image" onclick="switchTab('image')">이미지</button>
        <button class="tab-btn" data-tab="video" onclick="switchTab('video')">영상</button>
        <button class="tab-btn" data-tab="etc" onclick="switchTab('etc')">기타</button>
      </div>
    </div>
  </div>

  <!-- Top Message -->
  <div id="promptsTopMsg" style="padding:12px 16px 4px; display:none;">
    <div id="promptsMsgText" style="font-size:15px; font-weight:600; color:#fff; line-height:1.5;"></div>
    <div id="promptsMsgSub"  style="font-size:12px; color:rgba(255,255,255,0.6); margin-top:2px; display:none;"></div>
  </div>

  <!-- Masonry Grid -->
  <div class="prompts-masonry" id="promptsMasonry"></div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-header">
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
      <span class="modal-title-text" id="modalTitle"></span>
      <span class="modal-tool-badge" id="modalTool"></span>
    </div>
    <div class="modal-body">
      <div class="modal-img-wrap" id="modalImgWrap"></div>
      <div class="modal-prompt-area">
        <div class="prompt-copy-header">
          <span class="prompt-label">프롬프트</span>
          <button class="prompt-copy-btn" id="modalCopyBtn" onclick="copyModalPrompt()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
            </svg>
            복사
          </button>
        </div>
        <textarea class="prompt-textarea" id="modalPromptText" readonly></textarea>
      </div>
    </div>
  </div>

  <script>
    let PROMPT_DATA = {
      image: [
        {
          id: 'img-8',
          title: '액체 유리 UI 디자인',
          tool: 'Midjourney v6.1',
          thumb: '../../assets/images/lectures/main2.webp',
          prompt: 'liquid glass morphism UI design, floating interface panels with translucent glass effect, colorful gradient lights underneath, Apple Vision Pro aesthetic, product design showcase, dark background, ultra-detailed --ar 4:3 --style raw --v 6.1'
        },
        {
          id: 'img-7',
          title: '미래 도시 컨셉아트',
          tool: 'DALL-E 3',
          thumb: '../../assets/images/lectures/main4.webp',
          prompt: 'Futuristic Korean city in 2070, mixed traditional hanok and modern skyscraper architecture, cherry blossoms floating through neon-lit streets, aerial drone view, golden hour lighting, 8K photorealistic, cinema anamorphic lens, award-winning architectural photography'
        },
        {
          id: 'img-6',
          title: '스포츠카 광고 포스터',
          tool: 'Midjourney v6.1',
          thumb: '../../assets/images/posters/Sportage Poster.webp',
          prompt: 'Cinematic car advertisement poster, Kia Sportage on a misty mountain road at golden hour, dramatic crepuscular rays, Korean countryside backdrop, photorealistic CGI, 8K, shot by award-winning commercial photographer --ar 2:3 --v 6.1'
        },
        {
          id: 'img-5',
          title: '추억의 잔광 포스터',
          tool: 'Midjourney v6.1',
          thumb: '../../assets/images/posters/추억의 잔광(殘光)-포스터.webp',
          prompt: 'Movie poster "Lingering Afterglow of Memories (추억의 잔광)", elderly person silhouetted against warm amber sunset, nostalgic sepia film grain, dust particles floating in light, award-winning Korean art house cinema, Cannes-quality cinematography --ar 2:3 --style raw --v 6.1'
        },
        {
          id: 'img-4',
          title: '디지털 에고 포스터',
          tool: 'Midjourney v6.1',
          thumb: '../../assets/images/posters/Digital Ego poster.webp',
          prompt: 'Digital Ego - conceptual movie poster, human face fragmenting into digital data streams and circuit patterns, identity vs technology theme, cool blue and white color palette, minimalist modern poster design, international film festival submission quality --ar 2:3 --v 6.1'
        },
        {
          id: 'img-3',
          title: 'AI 강의 현장',
          tool: 'Gemini Imagen 3',
          thumb: '../../assets/images/lectures/main5.webp',
          prompt: 'Professional AI education classroom in Korea, engaged professionals learning hands-on AI tools on laptops, modern bright educational environment, collaborative atmosphere, authentic documentary photography style, natural lighting, shallow depth of field, 35mm film look'
        },
        {
          id: 'img-2',
          title: '누구의 속삭임 포스터',
          tool: 'Midjourney v6.1',
          thumb: '../../assets/images/posters/who\'s Poster.png',
          prompt: 'Who\'s Whisper (누구의 속삭임) - mysterious film poster, close-up of lips in absolute darkness, ethereal light catching subtle skin texture, extreme shallow depth of field, award-winning portrait photography, Cannes selection quality, Korean New Wave cinema --ar 2:3 --style raw --v 6.1'
        },
        {
          id: 'img-1',
          title: '정 (情) 영화 포스터',
          tool: 'Midjourney v6.1',
          thumb: '../../assets/images/posters/Jeong Poster.webp',
          prompt: 'Jeong (情) - Korean connection movie poster, elderly woman in quiet contemplation by a window, warm earthy amber tones, soft directional golden light, film grain, poetic minimalism, Cannes Film Award aesthetic, cultural depth, shot on 35mm film --ar 2:3 --style raw --v 6.1'
        }
      ],
      video: [
        {
          id: 'vid-4',
          title: '강의실 타임랩스',
          tool: 'Runway Gen-3 Alpha',
          thumb: '../../assets/images/lectures/main6.webp',
          prompt: 'Time-lapse video of a modern Korean AI classroom, students engaging with laptops and tablets, ambient window lighting shifting from morning blue to warm afternoon, smooth cinematic camera movement, educational documentary style, 4K, Runway Gen-3 Alpha'
        },
        {
          id: 'vid-3',
          title: '도시 영상 전환',
          tool: 'Pika Labs 2.0',
          thumb: '../../assets/images/lectures/main3.webp',
          prompt: 'Seamless video morphing transition: traditional Korean market stalls smoothly transform into a futuristic city street, temporal blend effect, warm market tones shifting to cool neon palette, 4K 60fps, cinematic depth of field, Pika Labs 2.0 generation'
        },
        {
          id: 'vid-2',
          title: 'AI 교육자 인트로 영상',
          tool: 'Kling AI 1.6',
          thumb: '../../assets/images/instructor1.webp',
          prompt: 'Professional intro video for AI educator, slow elegant zoom on portrait, soft light particles drifting around subject, dark studio background with subtle lens flare bokeh, text overlay "AI Creator" in gold, smooth 8-second seamless loop, broadcast quality'
        },
        {
          id: 'vid-1',
          title: 'AI 신경망 시각화',
          tool: 'Sora (OpenAI)',
          thumb: '../../assets/images/lectures/main1.webp',
          prompt: 'Cinematic visualization of AI neural network in motion, abstract glowing data streams flowing through luminous nodes, deep space background, blue and gold color palette, first-person camera journey through a digital brain structure, 10-second seamless loop, 4K HDR, Sora'
        }
      ],
      etc: [
        {
          id: 'oth-4',
          title: 'AI 성찰 에세이 표지',
          tool: 'Adobe Firefly 3',
          thumb: '../../assets/images/books/book4-정체된 나의 삶 속에서, AI와 춤추다.webp',
          prompt: 'Book cover "Dancing with AI in My Stagnant Life (정체된 나의 삶 속에서 AI와 춤추다)", human silhouette dancing with abstract luminous AI entity, warm sunset gradient background, watercolor texture overlay, literary essay aesthetic, Korean publishing market standard'
        },
        {
          id: 'oth-3',
          title: '프롬프트 엔지니어링 표지',
          tool: 'Stable Diffusion XL',
          thumb: '../../assets/images/books/book3 AI와 소통하는 법- 프롬프트 엔지니어링 기초편.webp',
          prompt: 'Book cover "Communicating with AI: Prompt Engineering Basics (AI와 소통하는 법)", clean minimalist tech design, geometric neural network motif in soft blue gradient, professional typography with Korean and English, educational publisher-ready quality'
        },
        {
          id: 'oth-2',
          title: 'AI 마케팅 고급 전략 표지',
          tool: 'Midjourney v6.1',
          thumb: '../../assets/images/books/Book2-디지털 마케팅의 판도를 바꾸는 생성형 AI 고급 전략.webp',
          prompt: 'Business book cover "Advanced Generative AI Strategies for Digital Marketing", dynamic upward trajectory graphic, corporate navy blue and gold color palette, data visualization elements, confident authoritative design, Korean business market --ar 2:3 --v 6.1'
        },
        {
          id: 'oth-1',
          title: 'AI 업무생산성 기초 표지',
          tool: 'DALL-E 3',
          thumb: '../../assets/images/books/Book1-업무생산성 높이는 생성형 AI 기초 전략.webp',
          prompt: 'Book cover "Basic Generative AI Strategies for Work Productivity (업무생산성 높이는 생성형 AI)", clean corporate design, rocket launch with ascending productivity graph metaphor, professional navy and white with gold accent, Korean business book market standard'
        }
      ]
    };

    let currentTab = 'image';
    let currentItem = null;

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === tab);
      });
      renderGrid(tab);
    }

    function renderGrid(tab) {
      const masonry = document.getElementById('promptsMasonry');
      if (!masonry) return;
      // inactive 섹션이면 작업중 표시
      if (window._sectionActive && window._sectionActive[tab] === false) {
        masonry.innerHTML = '<div style="text-align:center;padding:80px 20px;color:rgba(255,255,255,0.4);font-size:14px;"><div style="font-size:36px;margin-bottom:10px;">🚧</div>작업중입니다</div>';
        return;
      }
      const items = (PROMPT_DATA[tab] || []).slice().reverse();
      masonry.innerHTML = '';
      items.forEach((item, i) => {
        const card = document.createElement('div');
        card.className = 'prompt-card';
        card.style.animationDelay = (i * 0.05) + 's';
        card.innerHTML = `
          <img src="${item.thumb}" alt="${item.title}" loading="lazy" onerror="this.style.display='none'">
          <div class="prompt-card-overlay"></div>
          <span class="prompt-card-tool">${item.tool}</span>
          <span class="prompt-card-label">${item.title}</span>
        `;
        card.addEventListener('click', () => openModal(item));
        masonry.appendChild(card);
      });
    }

    function openModal(item) {
      currentItem = item;
      document.getElementById('modalTitle').textContent = item.title;
      document.getElementById('modalTool').textContent = item.tool;
      document.getElementById('modalImgWrap').innerHTML = `<img src="${item.thumb}" alt="${item.title}">`;
      document.getElementById('modalPromptText').value = item.prompt;
      const copyBtn = document.getElementById('modalCopyBtn');
      copyBtn.classList.remove('copied');
      copyBtn.innerHTML = `
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
        </svg>
        복사
      `;
      const modal = document.getElementById('detailModal');
      modal.classList.add('open');
      modal.scrollTop = 0;
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('open');
    }

    function copyModalPrompt() {
      const textarea = document.getElementById('modalPromptText');
      const btn = document.getElementById('modalCopyBtn');
      if (!textarea || !textarea.value) return;

      navigator.clipboard.writeText(textarea.value).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          복사됨!
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = `
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
            </svg>
            복사
          `;
        }, 2000);
      }).catch(() => {
        textarea.select();
        document.execCommand('copy');
      });
    }

    // ESC to close modal
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    // ===== admin 데이터 연동 =====
    function normMobilePath(p) {
      if (!p) return '';
      const stripped = p.replace(/^(\.\.\/)+/, '');
      // data URL은 그대로, 경로는 ../../ 붙임
      return stripped.startsWith('data:') ? stripped : '../../' + stripped;
    }

    async function loadPromptsFromAdmin() {
      try {
        let raw = null;
        if (window.sbLoad) raw = await window.sbLoad('promptsData', null);
        if (!raw) { const s = localStorage.getItem('promptsData'); if (s) raw = JSON.parse(s); }
        if (!raw) return;
        const total = ['image','video','etc'].reduce((n,c) => n + (raw[c]||[]).length, 0);
        if (!total) return;
        const convert = (arr) => (arr||[]).map(item => ({
          id:     item.id,
          title:  item.title || '',
          tool:   item.tool  || '',
          thumb:  normMobilePath(item.imgPath || item.imgDataUrl || ''),
          prompt: item.prompt || ''
        }));
        PROMPT_DATA = { image: convert(raw.image), video: convert(raw.video), etc: convert(raw.etc) };
      } catch(e) {}
    }

    // Init
    (async () => {
      await loadPromptsFromAdmin();
      renderGrid('image');
    })();

    // 페이지 메시지 로드 + 섹션별 active 체크
    (async () => {
      try {
        const cfg = window.sbLoad
          ? await sbLoad('pageMsgPrompts', {})
          : JSON.parse(localStorage.getItem('pageMsgPrompts') || '{}');
        if (cfg.mainMsg) {
          const box  = document.getElementById('promptsTopMsg');
          const text = document.getElementById('promptsMsgText');
          const sub  = document.getElementById('promptsMsgSub');
          text.innerHTML = cfg.mainMsg.replace(/\n/g,'<br>');
          box.style.display = '';
          if (cfg.subtitle) {
            sub.innerHTML = cfg.subtitle.replace(/\n/g,'<br>');
            sub.style.display = '';
          }
        }
        // 섹션별 active 상태 (기본값 true)
        window._sectionActive = {
          image: cfg.imageActive !== false,
          video: cfg.videoActive !== false,
          etc:   cfg.etcActive   !== false
        };
        const anyActive = Object.values(window._sectionActive).some(Boolean);
        if (!anyActive) {
          // 전부 inactive
          document.querySelector('.tabs-wrap').style.display = 'none';
          document.getElementById('promptsMasonry').innerHTML =
            '<div style="text-align:center;padding:80px 20px;color:rgba(255,255,255,0.45);font-size:15px;"><div style="font-size:40px;margin-bottom:12px;">🚧</div><div>작업중입니다</div></div>';
        } else {
          // inactive 탭 버튼 숨기기
          ['image','video','etc'].forEach(cat => {
            if (!window._sectionActive[cat]) {
              const btn = document.querySelector(`.tab-btn[data-tab="${cat}"]`);
              if (btn) btn.style.display = 'none';
            }
          });
          // 현재 탭이 inactive면 첫 번째 active 탭으로 전환
          if (!window._sectionActive[currentTab]) {
            const first = ['image','video','etc'].find(c => window._sectionActive[c]);
            if (first) switchTab(first);
          }
        }
      } catch(e) {}
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../js/supabase-client.js"></script>
  <script src="../../assets/js/mobile-nav.js?v=1"></script>
</body>
</html>
