<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing 설정 | 관리자 패널</title>
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <script src="admin-auth.js"></script>
  <script>requireAuth();</script>
  <style>
    /* ── 슬라이드 행 ── */
    .slide-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      transition: border-color 0.2s, background 0.2s;
    }
    .slide-row.drag-over { border-color: var(--gold); background: rgba(201,169,110,0.06); }
    .slide-row.dragging  { opacity: 0.4; }
    .slide-drag-handle {
      cursor: grab; color: var(--sub); font-size: 16px;
      user-select: none; flex-shrink: 0; line-height: 1; padding-right: 4px;
    }
    .slide-drag-handle:active { cursor: grabbing; }
    .slide-num {
      flex-shrink: 0; width: 22px; text-align: center;
      font-size: 13px; font-weight: 600; color: var(--sub);
    }
    .slide-thumb {
      flex-shrink: 0; width: 100px; height: 63px;
      border-radius: 6px; object-fit: cover;
      background: var(--bg); border: 1px solid var(--border);
    }
    .slide-thumb-placeholder {
      flex-shrink: 0; width: 100px; height: 63px;
      border-radius: 6px; background: var(--bg);
      border: 1px dashed var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: var(--sub);
    }
    .slide-path-input {
      flex: 1;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text);
      font-family: inherit; font-size: 12px;
      padding: 7px 10px; outline: none; transition: border-color 0.2s;
    }
    .slide-path-input:focus { border-color: rgba(201,169,110,0.5); }
    .slide-icon-btn {
      flex-shrink: 0;
      width: 30px; height: 30px;
      border: 1px solid var(--border); border-radius: 7px;
      background: transparent; color: var(--sub); font-size: 13px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .slide-icon-btn:hover { border-color: var(--gold); color: var(--gold); }
    .slide-icon-btn.del:hover { border-color: var(--red); color: var(--red); }

    /* ── 섹션 이미지 그리드 (홈페이지 2-column 레이아웃 동일) ── */
    .section-img-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    /* 첫 번째 카드: 가로 전체 (landscape) */
    .section-img-item:first-child {
      grid-column: 1 / -1;
    }
    /* 마지막 카드가 홀수 번째(짝수 자식)이면 가로 전체 */
    .section-img-item:last-child:nth-child(even) {
      grid-column: 1 / -1;
    }

    .section-img-item {
      display: flex; flex-direction: column; gap: 8px;
      transition: opacity 0.2s;
      border-radius: 12px;
    }
    .section-img-item.dragging { opacity: 0.35; }
    /* | 표시: 카드 좌측 */
    .section-img-item.drop-before {
      box-shadow: -4px 0 0 0 var(--gold);
      border-radius: 12px;
    }
    /* | 표시: 카드 우측 */
    .section-img-item.drop-after {
      box-shadow: 4px 0 0 0 var(--gold);
      border-radius: 12px;
    }

    /* 헤더: 드래그핸들 + 라벨 입력 */
    .section-img-item-header {
      display: flex; align-items: center; gap: 6px;
    }
    .section-drag-handle {
      cursor: grab; color: var(--sub); font-size: 14px;
      user-select: none; flex-shrink: 0; line-height: 1; padding: 2px 4px;
    }
    .section-drag-handle:active { cursor: grabbing; }
    .section-img-label-input {
      flex: 1;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 7px; color: var(--gold);
      font-family: inherit; font-size: 12px; font-weight: 700;
      padding: 5px 8px; outline: none; text-align: center;
      transition: border-color 0.2s;
    }
    .section-img-label-input:focus { border-color: rgba(201,169,110,0.5); }

    /* 이미지 미리보기: 기본 세로(portrait) 비율 */
    .section-img-preview {
      border-radius: 10px; overflow: hidden;
      background: var(--bg); border: 1px solid var(--border);
      position: relative;
      aspect-ratio: 3/4;
    }
    /* 첫 번째 카드 + 마지막 단독 카드: 가로(landscape) 비율 */
    .section-img-item:first-child .section-img-preview,
    .section-img-item:last-child:nth-child(even) .section-img-preview {
      aspect-ratio: 16/9;
    }
    .section-img-preview img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .section-img-preview-empty {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: var(--sub); text-align: center;
    }
    .section-img-actions {
      display: flex; gap: 4px;
    }
    .section-img-actions input {
      flex: 1; min-width: 0;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 7px; color: var(--text);
      font-family: inherit; font-size: 11px;
      padding: 6px 8px; outline: none; transition: border-color 0.2s;
    }
    .section-img-actions input:focus { border-color: rgba(201,169,110,0.5); }
  </style>
</head>
<body>

<div class="admin-body">

    <a href="works.html"      class="sidebar-item sidebar-item-sub">AI영화</a>
    <a href="works.html"      class="sidebar-item sidebar-item-sub">도서</a>

  <main class="admin-main">

    <div class="panel-header">
      <div>
        <div class="panel-title">Landing 설정</div>

    <!-- ① 메인 슬라이드 이미지 -->
    <div class="card">

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">

    <!-- ② 섹션 이미지 (강사/강의/작업들/문의/프롬프트/M/V) -->
    <div class="card">

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="admin-data.js?v=3"></script>
<script>
/* ═══════════════════════════════════════
   슬라이드 관리
═══════════════════════════════════════ */
let slidesData = loadData('landingSlides', DEFAULT_SLIDES);
let slideDragSrcIdx = null;
let activeSlidePickerIdx = null;

function renderSlides() {
  const el = document.getElementById('slideList');
  el.innerHTML = slidesData.map((path, i) => `
    <div class="slide-row" draggable="true"
         ondragstart="onSlideDragStart(event,${i})"
         ondragend="onSlideDragEnd(event)"
         ondragover="onSlideDragOver(event,${i})"
         ondrop="onSlideDrop(event,${i})">
      <span class="slide-drag-handle" title="드래그로 순서 변경">☰</span>
      <span class="slide-num">${i + 1}</span>
      ${path
        ? `<img class="slide-thumb" src="${escHtml(path)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
           <div class="slide-thumb-placeholder" style="display:none;">이미지<br>없음</div>`
        : `<div class="slide-thumb-placeholder">이미지<br>없음</div>`}
      <input class="slide-path-input" type="text" value="${escHtml(path)}"
             onchange="slidesData[${i}]=this.value"
             placeholder="../assets/images/lectures/main1.png">
      <button class="slide-icon-btn" title="미리보기 갱신" onclick="reloadSlideThumb(${i})">↻</button>
      <button class="slide-icon-btn" title="파일 선택" onclick="openSlideFilePicker(${i})">📁</button>
      <button class="slide-icon-btn del" title="삭제" onclick="deleteSlide(${i})">✕</button>
    </div>
  `).join('');
  document.getElementById('slideCardTitle').textContent = `🖼️ main image (${slidesData.length} slide)`;
}

function reloadSlideThumb(i) {
  const rows = document.querySelectorAll('#slideList .slide-row');
  const row = rows[i];
  if (!row) return;
  const input = row.querySelector('.slide-path-input');
  slidesData[i] = input.value.trim();
  renderSlides();
}

function addSlide() {
  slidesData.push('');
  renderSlides();
}

function deleteSlide(i) {
  if (slidesData.length <= 1) { toast('슬라이드는 최소 1개 필요합니다', true); return; }
  slidesData.splice(i, 1);
  renderSlides();
}

function saveSlides() {
  // 현재 입력값 동기화
  document.querySelectorAll('#slideList .slide-path-input').forEach((inp, i) => {
    slidesData[i] = inp.value.trim();
  });
  slidesData = slidesData.filter(p => p); // 빈 항목 제거
  if (saveData('landingSlides', slidesData)) { toast('슬라이드가 저장되었습니다'); renderSlides(); }
  else toast('저장 실패', true);
}

function openSlideFilePicker(i) {
  activeSlidePickerIdx = i;
  document.getElementById('slideFilePicker').click();
}

async function onSlideFilePicked(input) {
  if (!input.files || !input.files[0] || activeSlidePickerIdx === null) return;
  const file = input.files[0];
  toast('이미지 업로드 중...');
  const url = window.sbUploadImage ? await sbUploadImage(file, 'landing') : null;
  slidesData[activeSlidePickerIdx] = url || ('../assets/images/' + file.name);
  input.value = '';
  renderSlides();
  activeSlidePickerIdx = null;
  if (url) toast('이미지 업로드 완료 ✓');
  else toast('업로드 실패 — 경로를 직접 입력하세요', true);
}

/* 드래그 */
function onSlideDragStart(e, i) {
  slideDragSrcIdx = i;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => e.target.closest('.slide-row').classList.add('dragging'), 0);
}
function onSlideDragEnd(e) {
  e.target.closest('.slide-row').classList.remove('dragging');
  document.querySelectorAll('#slideList .slide-row').forEach(r => r.classList.remove('drag-over'));
}
function onSlideDragOver(e, i) {
  e.preventDefault();
  document.querySelectorAll('#slideList .slide-row').forEach(r => r.classList.remove('drag-over'));
  document.querySelectorAll('#slideList .slide-row')[i]?.classList.add('drag-over');
}
function onSlideDrop(e, i) {
  e.preventDefault();
  document.querySelectorAll('#slideList .slide-row').forEach(r => r.classList.remove('drag-over'));
  if (slideDragSrcIdx === null || slideDragSrcIdx === i) { slideDragSrcIdx = null; return; }
  const moved = slidesData.splice(slideDragSrcIdx, 1)[0];
  slidesData.splice(i, 0, moved);
  slideDragSrcIdx = null;
  renderSlides();
}

/* ═══════════════════════════════════════
   섹션 이미지 (강사/강의/작업들/문의/프롬프트/M/V)
═══════════════════════════════════════ */
let panelsData = loadData('landingSidePanels', DEFAULT_SIDE_PANELS);
let activePanelPickerIdx = null;
let panelDragSrcIdx = null;
let panelDropIdx = null; // 최종 삽입 위치

function renderSectionPanels() {
  const el = document.getElementById('sectionImgGrid');
  el.innerHTML = panelsData.map((panel, i) => `
    <div class="section-img-item"
         ondragover="onPanelDragOver(event,${i})"
         ondragleave="onPanelDragLeave(event)"
         ondrop="onPanelDrop(event,${i})">
      <div class="section-img-item-header">
        <span class="section-drag-handle"
              draggable="true"
              title="☰ 드래그로 순서 변경"
              ondragstart="onPanelDragStart(event,${i})"
              ondragend="onPanelDragEnd(event)">☰</span>
        <input class="section-img-label-input" type="text" value="${escHtml(panel.label || '')}"
               placeholder="카드 제목">
      </div>
      <div class="section-img-preview" id="sectionPreview-${i}">
        ${panel.path
          ? `<img src="${escHtml(panel.path)}" onerror="this.style.display='none';document.getElementById('sectionEmpty-${i}').style.display='flex';">`
          : ''}
        <div class="section-img-preview-empty" id="sectionEmpty-${i}" style="${panel.path ? 'display:none;' : ''}">이미지<br>없음</div>
      </div>
      <div class="section-img-actions">
        <input type="text" value="${escHtml(panel.path || '')}"
               placeholder="../assets/images/...">
        <button class="slide-icon-btn" title="미리보기 갱신" onclick="reloadPanelThumb(${i})">↻</button>
        <button class="slide-icon-btn" title="파일 선택" onclick="openSectionFilePicker(${i})">📁</button>
      </div>
    </div>
  `).join('');
}

/* 입력값을 panelsData에 동기화 */
function syncPanelItem(i) {
  const items = document.querySelectorAll('#sectionImgGrid .section-img-item');
  const item = items[i];
  if (!item || !panelsData[i]) return;
  const lbl = item.querySelector('.section-img-label-input');
  const pth = item.querySelector('.section-img-actions input');
  if (lbl) panelsData[i].label = lbl.value.trim();
  if (pth) panelsData[i].path  = pth.value.trim();
}

function reloadPanelThumb(i) {
  syncPanelItem(i);
  renderSectionPanels();
}

function openSectionFilePicker(i) {
  activePanelPickerIdx = i;
  document.getElementById('sectionFilePicker').click();
}

async function onSectionFilePicked(input) {
  if (!input.files || !input.files[0] || activePanelPickerIdx === null) return;
  const file = input.files[0];
  toast('이미지 업로드 중...');
  const url = window.sbUploadImage ? await sbUploadImage(file, 'sections') : null;
  panelsData[activePanelPickerIdx].path = url || ('../assets/images/' + file.name);
  input.value = '';
  renderSectionPanels();
  activePanelPickerIdx = null;
  if (url) toast('이미지 업로드 완료 ✓');
  else toast('업로드 실패 — 경로를 직접 입력하세요', true);
}

function saveSectionPanels() {
  /* 전체 입력값 동기화 (label + path) */
  document.querySelectorAll('#sectionImgGrid .section-img-item').forEach((item, i) => {
    if (!panelsData[i]) return;
    const lbl = item.querySelector('.section-img-label-input');
    const pth = item.querySelector('.section-img-actions input');
    if (lbl) panelsData[i].label = lbl.value.trim();
    if (pth) panelsData[i].path  = pth.value.trim();
  });
  if (saveData('landingSidePanels', panelsData)) toast('섹션 이미지가 저장되었습니다');
  else toast('저장 실패', true);
  renderSectionPanels();
}

/* ── 드래그로 순서 변경 ── */
function clearPanelDropIndicators() {
  document.querySelectorAll('#sectionImgGrid .section-img-item').forEach(r => {
    r.classList.remove('drop-before', 'drop-after');
  });
}

function onPanelDragStart(e, i) {
  panelDragSrcIdx = i;
  panelDropIdx = null;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(i));
  // 드래그 시작 카드를 반투명하게
  setTimeout(() => {
    const items = document.querySelectorAll('#sectionImgGrid .section-img-item');
    if (items[i]) items[i].classList.add('dragging');
  }, 0);
}

function onPanelDragEnd(e) {
  clearPanelDropIndicators();
  document.querySelectorAll('#sectionImgGrid .section-img-item').forEach(r => r.classList.remove('dragging'));
  panelDragSrcIdx = null;
  panelDropIdx = null;
}

function onPanelDragOver(e, i) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  clearPanelDropIndicators();

  const items = document.querySelectorAll('#sectionImgGrid .section-img-item');
  const item = items[i];
  if (!item) return;

  const rect = item.getBoundingClientRect();
  const isAfter = e.clientX > rect.left + rect.width / 2;
  item.classList.add(isAfter ? 'drop-after' : 'drop-before');
  panelDropIdx = isAfter ? i + 1 : i;
}

function onPanelDragLeave(e) {
  // 자식 요소로 이동할 때는 무시
  const related = e.relatedTarget;
  if (related && e.currentTarget.contains(related)) return;
  clearPanelDropIndicators();
}

function onPanelDrop(e, i) {
  e.preventDefault();
  clearPanelDropIndicators();
  document.querySelectorAll('#sectionImgGrid .section-img-item').forEach(r => r.classList.remove('dragging'));

  if (panelDragSrcIdx === null) { panelDragSrcIdx = null; panelDropIdx = null; return; }

  let target = (panelDropIdx !== null) ? panelDropIdx : i;

  // 제자리 드롭이면 무시
  if (target === panelDragSrcIdx || target === panelDragSrcIdx + 1) {
    panelDragSrcIdx = null; panelDropIdx = null; return;
  }

  const moved = panelsData.splice(panelDragSrcIdx, 1)[0];
  // splice 후 인덱스 보정: 원본이 target보다 앞이면 target이 1 줄어듦
  if (panelDragSrcIdx < target) target--;
  panelsData.splice(target, 0, moved);

  panelDragSrcIdx = null;
  panelDropIdx = null;
  renderSectionPanels();
}

/* ═══════════════════════════════════════
   Landing 메시지
═══════════════════════════════════════ */
function loadLandingForm() {
  const cfg = loadData('homeConfig', DEFAULT_HOME);
  document.getElementById('homeMainMsg').value = cfg.mainMsg  || cfg.message || DEFAULT_HOME.mainMsg;
  document.getElementById('homeSubMsg').value  = cfg.subtitle || '';
  document.getElementById('homeMobile').value  = cfg.mobile   || DEFAULT_HOME.mobile;
}

function saveLandingMsg() {
  const mainMsg  = document.getElementById('homeMainMsg').value.trim();
  const subtitle = document.getElementById('homeSubMsg').value.trim();
  const cfg = {
    mainMsg,
    subtitle,
    message: mainMsg,
    mobile:  document.getElementById('homeMobile').value.trim()
  };
  if (saveData('homeConfig', cfg)) toast('저장되었습니다');
  else toast('저장 실패', true);
}

/* ── INIT ── */
renderSlides();
renderSectionPanels();
loadLandingForm();
</script>
</body>
