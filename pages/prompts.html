        prompt: 'Book cover "Dancing with AI in My Stagnant Life (정체된 나의 삶 속에서 AI와 춤추다)", human silhouette dancing with abstract luminous AI entity, warm sunset gradient background, watercolor texture overlay, literary essay aesthetic, Korean publishing market standard'
      },
      {
        id: 'oth-3',
        title: '프롬프트 엔지니어링 표지',
        tool: 'Stable Diffusion XL',
        thumb: 'assets/images/books/book3 AI와 소통하는 법- 프롬프트 엔지니어링 기초편.png',
        prompt: 'Book cover "Communicating with AI: Prompt Engineering Basics (AI와 소통하는 법)", clean minimalist tech design, geometric neural network motif in soft blue gradient, professional typography with Korean and English, educational publisher-ready quality'
      },
      {
        id: 'oth-2',
        title: 'AI 마케팅 고급 전략 표지',
        tool: 'Midjourney v6.1',
        thumb: 'assets/images/books/Book2-디지털 마케팅의 판도를 바꾸는 생성형 AI 고급 전략.png',
        prompt: 'Business book cover "Advanced Generative AI Strategies for Digital Marketing", dynamic upward trajectory graphic, corporate navy blue and gold color palette, data visualization elements, confident authoritative design, Korean business market --ar 2:3 --v 6.1'
      },
      {
        id: 'oth-1',
        title: 'AI 업무생산성 기초 표지',
        tool: 'DALL-E 3',
        thumb: 'assets/images/books/Book1-업무생산성 높이는 생성형 AI 기초 전략.png',
        prompt: 'Book cover "Basic Generative AI Strategies for Work Productivity (업무생산성 높이는 생성형 AI)", clean corporate design, rocket launch with ascending productivity graph metaphor, professional navy and white with gold accent, Korean business book market standard'
      }
    ]
  };

  let currentPromptTab = 'image';
  let selectedPromptId = null;

  function switchPromptTab(tab) {
    currentPromptTab = tab;
    selectedPromptId = null;
    document.querySelectorAll('.prompts-tabs .tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    // 열 수 적용
    const cols = (window._promptColumns && window._promptColumns[tab]) || 4;
    const masonryEl = document.querySelector('.prompts-masonry');
    if (masonryEl) masonryEl.style.setProperty('--prompt-cols', cols);
    renderPrompts(tab);
  }

  function renderPrompts(tab) {
    const masonry = document.getElementById('promptsMasonry');
    if (!masonry) return;
    // inactive 섹션이거나 내용이 없으면 준비중 표시
    const isInactive = window._promptSectionActive && window._promptSectionActive[tab] === false;
    const items = (PROMPT_DATA[tab] || []).filter(p => p.active !== false).slice().reverse();
    const isEmpty = items.length === 0;
    if (isInactive || isEmpty) {
      masonry.innerHTML = '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:rgba(255,255,255,0.35);font-size:15px;font-family:\'Poppins\',\'SUITE\',sans-serif;"><div style="font-size:38px;">🚧</div><div>준비중입니다</div></div>';
      showPanelWip();
      return;
    }
    masonry.innerHTML = '';
    showPanelEmpty();
    items.forEach((item, i) => {
      const card = document.createElement('div');
      card.className = 'prompt-card';
      card.dataset.id = item.id;
      card.style.animationDelay = (i * 0.06) + 's';
      card.innerHTML = `
        <img src="${item.thumb}" alt="${item.title}" loading="lazy" onerror="this.style.display='none'">
        <div class="prompt-card-overlay"></div>
        <span class="prompt-card-tool">${item.tool}</span>
        <span class="prompt-card-label">${item.title}</span>
      `;
      card.addEventListener('click', () => selectPrompt(item.id, tab));
      masonry.appendChild(card);
    });
  }

  const COPY_SVG = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
  const CHECK_SVG = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;

  function isMobileView() {
    return window.innerWidth <= 900;
  }

  function selectPrompt(id, tab) {
    const items = PROMPT_DATA[tab] || [];
    const item = items.find(x => x.id === id);
    if (!item) return;

    selectedPromptId = id;

    document.querySelectorAll('.prompt-card').forEach(c => {
      c.classList.toggle('active', c.dataset.id === id);
    });

    if (isMobileView()) {
      openPromptModal(item);
    } else {
      showPanelDetail(item);
    }
  }

  function showPanelEmpty() {
    const empty = document.getElementById('promptPanelEmpty');
    const detail = document.getElementById('promptPanelDetail');
    if (empty) {
      empty.style.display = 'flex';
      empty.querySelector('p').innerHTML = '이미지를 클릭하면<br>프롬프트를 볼 수 있습니다';
    }
    if (detail) detail.style.display = 'none';
  }

  function showPanelWip() {
    const empty = document.getElementById('promptPanelEmpty');
    const detail = document.getElementById('promptPanelDetail');
    if (empty) {
      empty.style.display = 'flex';
      empty.querySelector('p').innerHTML = '준비중입니다';
    }
    if (detail) detail.style.display = 'none';
  }

  function showPanelDetail(item) {
    const empty = document.getElementById('promptPanelEmpty');
    const detail = document.getElementById('promptPanelDetail');
    if (!detail) return;

    if (empty) empty.style.display = 'none';
    detail.style.display = 'flex';

    const mediaWrap = document.getElementById('promptDetailMedia');
    if (mediaWrap) {
      mediaWrap.innerHTML = `<img src="${item.thumb}" alt="${item.title}" onerror="this.style.display='none'">`;
    }

    const metaRow = document.getElementById('promptDetailMeta');
    if (metaRow) {
      metaRow.innerHTML = `
        <span class="detail-title-text">${item.title}</span>
        <span class="detail-tool-badge">${item.tool}</span>
      `;
    }

    const textarea = document.getElementById('promptTextarea');
    if (textarea) textarea.value = item.prompt;

    const copyBtn = document.getElementById('promptCopyBtn');
    if (copyBtn) {
      copyBtn.classList.remove('copied');
      copyBtn.innerHTML = COPY_SVG + ' 복사';
    }

    detail.scrollTop = 0;
  }

  /* ===== MOBILE MODAL ===== */
  function openPromptModal(item) {
    document.getElementById('modalTitleText').textContent = item.title;
    document.getElementById('modalToolBadge').textContent = item.tool;
    document.getElementById('modalImgWrap').innerHTML =
      `<img src="${item.thumb}" alt="${item.title}" onerror="this.style.display='none'">`;
    document.getElementById('modalPromptTextarea').value = item.prompt;

    const btn = document.getElementById('modalCopyBtn');
    if (btn) { btn.classList.remove('copied'); btn.innerHTML = COPY_SVG + ' 복사'; }

    const overlay = document.getElementById('promptsModalOverlay');
    overlay.classList.add('open');
    overlay.querySelector('.prompts-modal-body').scrollTop = 0;
  }

  function closePromptModal() {
    document.getElementById('promptsModalOverlay').classList.remove('open');
    document.querySelectorAll('.prompt-card').forEach(c => c.classList.remove('active'));
    selectedPromptId = null;
  }

  function copyModalPrompt() {
    const textarea = document.getElementById('modalPromptTextarea');
    const btn = document.getElementById('modalCopyBtn');
    if (!textarea || !textarea.value) return;
    _doCopy(textarea.value, btn);
  }

  /* ===== DESKTOP COPY ===== */
  function copyPrompt() {
    const textarea = document.getElementById('promptTextarea');
    const btn = document.getElementById('promptCopyBtn');
    if (!textarea || !textarea.value) return;
    _doCopy(textarea.value, btn);
  }

  function _doCopy(text, btn) {
    const doFeedback = () => {
      if (!btn) return;
      btn.classList.add('copied');
      btn.innerHTML = CHECK_SVG + ' 복사됨!';
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = COPY_SVG + ' 복사';
      }, 2000);
    };
    navigator.clipboard.writeText(text).then(doFeedback).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      doFeedback();
    });
  }

  /* ===== CLOSE MODAL ON BACKDROP CLICK ===== */
  document.addEventListener('click', e => {
    const overlay = document.getElementById('promptsModalOverlay');
    if (overlay && e.target === overlay) closePromptModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePromptModal();
  });

  async function loadPromptPageMsg() {
    try {
      const cfg = window.sbLoad
        ? await sbLoad('pageMsgPrompts', {})
        : JSON.parse(localStorage.getItem('pageMsgPrompts') || '{}');
      const textEl = document.getElementById('promptsMsgText');
      const subEl  = document.getElementById('promptsMsgSub');
      if (textEl && cfg.mainMsg)  textEl.innerHTML = cfg.mainMsg.replace(/\n/g,'<br>');
      if (subEl  && cfg.subtitle) {
        subEl.innerHTML = cfg.subtitle.replace(/\n/g,'<br>');
        subEl.style.display = '';
      }
      // 섹션별 active 상태 (기본값 true)
      window._promptSectionActive = {
        image: cfg.imageActive !== false,
        video: cfg.videoActive !== false,
        etc:   cfg.etcActive   !== false
      };
      // 섹션별 열 수 (기본값 4)
      window._promptColumns = {
        image: Math.min(8, Math.max(1, parseInt(cfg.imageColumns) || 4)),
        video: Math.min(8, Math.max(1, parseInt(cfg.videoColumns) || 4)),
        etc:   Math.min(8, Math.max(1, parseInt(cfg.etcColumns)   || 4))
      };
      // 탭 버튼 표시 제어
      const tabBtnMap = { image: '[data-tab="image"]', video: '[data-tab="video"]', etc: '[data-tab="etc"]' };
      let firstActive = null;
      ['image','video','etc'].forEach(cat => {
        const btn = document.querySelector(`.tab-btn${tabBtnMap[cat]}`);
        if (window._promptSectionActive[cat]) {
          if (!firstActive) firstActive = cat;
          if (btn) btn.style.display = '';
        } else {
          if (btn) btn.style.display = 'none';
        }
      });
      // 전부 inactive면 탭 바 숨기고 "작업중" 표시
      const anyActive = Object.values(window._promptSectionActive).some(Boolean);
      if (!anyActive) {
        const tabsBar = document.querySelector('.prompts-tabs');
        if (tabsBar) tabsBar.style.display = 'none';
        const masonry = document.getElementById('promptsMasonry');
        if (masonry) masonry.innerHTML = '<div style="text-align:center;padding:80px 20px;color:rgba(255,255,255,0.4);font-size:14px;"><div style="font-size:36px;margin-bottom:10px;">🚧</div>작업중입니다</div>';
      }
      return firstActive;
    } catch(e) { return null; }
  }

  function normPromptPath(p) {
    if (!p) return '';
    // admin stores '../assets/...' — strip leading '../' for root-relative usage
    return p.replace(/^(\.\.\/)+/, '');
  }

  async function loadPromptsFromAdmin() {
    try {
      let raw = null;
      if (window.sbLoad) raw = await window.sbLoad('promptsData', null);
      if (!raw) { const s = localStorage.getItem('promptsData'); if (s) raw = JSON.parse(s); }
      if (!raw) return;
      const total = ['image','video','etc'].reduce((n,c) => n + (raw[c]||[]).length, 0);
      if (!total) return;
      const convert = (arr) => (arr||[]).map(item => ({
        id:     item.id,
        title:  item.title || '',
        tool:   item.tool  || '',
        thumb:  item.imgDataUrl || normPromptPath(item.imgPath || ''),
        prompt: item.prompt || ''
      }));
      PROMPT_DATA = { image: convert(raw.image), video: convert(raw.video), etc: convert(raw.etc) };
    } catch(e) {}
  }

  async function initPromptsPage() {
    await loadPromptsFromAdmin();
    const firstActive = await loadPromptPageMsg();
    const startTab = firstActive || 'image';
    currentPromptTab = startTab;
    // 첫 탭 버튼 active 클래스 설정
    document.querySelectorAll('.prompts-tabs .tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === startTab);
    });
    // 열 수 적용
    const cols = (window._promptColumns && window._promptColumns[startTab]) || 4;
    const masonryEl = document.querySelector('.prompts-masonry');
    if (masonryEl) masonryEl.style.setProperty('--prompt-cols', cols);
    renderPrompts(startTab);
  }

  window.initPromptsPage = initPromptsPage;
  window.switchPromptTab = switchPromptTab;
  window.copyPrompt = copyPrompt;
  window.copyModalPrompt = copyModalPrompt;
  window.closePromptModal = closePromptModal;
})();
</script>
