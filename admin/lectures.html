<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강의 관리 | 관리자 패널</title>
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <style>
    /* 인라인 레이블 행 */
    .lec-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .lec-row label {
      font-size: 12px;
      color: var(--sub);
      white-space: nowrap;
      flex-shrink: 0;
      width: 64px;
      text-align: right;
    }
    .lec-row input,
    .lec-row select {
      flex: 1;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .lec-row input:focus,
    .lec-row select:focus { border-color: rgba(201,169,110,0.5); }
    .lec-row select { cursor: pointer; }

    /* 이모지 select 크기 고정 */
    #lecEmoji {
      flex: none !important;
      width: 160px;
    }

    /* 강의 소개 textarea */
    #lecIntro {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      resize: vertical;
      min-height: 80px;
      line-height: 1.6;
      transition: border-color 0.2s;
    }
    #lecIntro:focus { border-color: rgba(201,169,110,0.5); }

    /* 모달 max-width 더 넓게 */
    #lecModal .modal-box { max-width: 620px; }

    /* 섹션 구분선 */
    .lec-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin: 16px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .lec-section-title:first-child { margin-top: 0; }

    /* ── Admin 세그먼트 탭 ── */
    .admin-seg {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .admin-seg-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--sub);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 0;
      cursor: pointer;
      transition: all 0.2s;
    }
    .admin-seg-btn + .admin-seg-btn { border-left: 1px solid var(--border); }
    .admin-seg-btn.active { background: var(--gold); color: #0d0d0d; font-weight: 700; }
    .admin-seg-btn:not(.active):hover { background: rgba(255,255,255,0.04); color: var(--text); }

    /* ── 드래그 핸들 ── */
    .drag-handle {
      cursor: grab;
      color: var(--sub);
      font-size: 16px;
      padding: 0 8px 0 0;
      user-select: none;
      flex-shrink: 0;
      line-height: 1;
    }
    .drag-handle:active { cursor: grabbing; }
    .item-row.drag-over { border: 1px solid var(--gold) !important; background: rgba(201,169,110,0.06); border-radius: 10px; }

    /* ── 히스토리 세션 ── */
    .hist-session {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .hist-session-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }
    .hist-year-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--gold);
      font-family: 'Poppins', sans-serif;
    }
    .hist-items { padding: 6px 14px; }
    .hist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 13px;
      color: var(--text);
      gap: 8px;
    }
    .hist-item:last-child { border-bottom: none; }
    .hist-item-text { flex: 1; min-width: 0; }
    .hist-item-del {
      background: none;
      border: none;
      color: var(--red);
      cursor: pointer;
      font-size: 13px;
      padding: 2px 4px;
      opacity: 0.6;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .hist-item-del:hover { opacity: 1; }
    .hist-add-row {
      display: flex;
      gap: 8px;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      background: var(--bg2);
    }
    .hist-add-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 6px 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    .hist-add-input:focus { border-color: rgba(201,169,110,0.5); }
    .hist-empty { font-size: 13px; color: var(--sub); padding: 12px 0; text-align: center; }

    /* ── 강의 카드 그리드 ── */
    .lec-card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .lec-admin-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .lec-admin-card.drag-over { border-color: var(--gold) !important; background: rgba(201,169,110,0.06); }
    .lec-admin-card-header {
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a2035 0%, #0d1828 100%);
      position: relative;
    }
    .lec-admin-card-emoji { font-size: 40px; }
    .lec-admin-card-drag {
      position: absolute;
      top: 8px;
      left: 8px;
      color: rgba(255,255,255,0.35);
      font-size: 14px;
      cursor: grab;
      user-select: none;
    }
    .lec-admin-card-drag:active { cursor: grabbing; }
    .lec-admin-card-body {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .lec-admin-card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }
    .lec-admin-card-meta { font-size: 11px; color: var(--sub); }
    .lec-admin-card-footer {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
    }

    /* ── 강의이력 카드 ── */
    .hist-year-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .hist-year-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(135deg, rgba(201,169,110,0.15), rgba(201,169,110,0.05));
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
    .hist-year-card-head:hover { background: linear-gradient(135deg, rgba(201,169,110,0.22), rgba(201,169,110,0.08)); }
    .hist-toggle-arrow { font-size: 11px; color: var(--sub); }
    .hist-year-body {
      padding: 16px;
      border-top: 1px solid var(--border);
    }
    .hist-textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      resize: vertical;
      min-height: 140px;
      line-height: 1.9;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .hist-textarea:focus { border-color: rgba(201,169,110,0.5); }
    .hist-year-footer { display: flex; justify-content: flex-end; margin-top: 10px; }
    .hist-year-card.drag-over { border-color: var(--gold) !important; background: rgba(201,169,110,0.04); }
    .hist-year-drag-handle {
      cursor: grab;
      color: var(--sub);
      font-size: 14px;
      user-select: none;
      flex-shrink: 0;
      padding-right: 4px;
    }
    .hist-year-drag-handle:active { cursor: grabbing; }
  </style>
</head>

<script>
let lectures = loadData('lecturesData', DEFAULT_LECTURES);

/* ── 세그먼트 탭 전환 ── */
function switchAdminLecTab(tab) {
  const isMat = tab === 'material';
  document.getElementById('adminTabMaterial').classList.toggle('active', isMat);
  document.getElementById('adminTabHistory').classList.toggle('active', !isMat);
  document.getElementById('lecMaterialPanel').style.display = isMat ? '' : 'none';
  document.getElementById('lecHistoryPanel').style.display  = isMat ? 'none' : '';
  document.getElementById('lecAddBtn').style.display = isMat ? '' : 'none';
  if (!isMat) renderHistorySessions();
}

/* ══════════════════════════════════════
   강의안 드래그 리오더 (row)
══════════════════════════════════════ */
let dragSrcIdx = null;

function onLecDragStart(e, idx) {
  dragSrcIdx = idx;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => e.target.closest('.item-row').style.opacity = '0.4', 0);
}
function onLecDragEnd(e) {
  const row = e.target.closest('.item-row');
  if (row) row.style.opacity = '';
  document.querySelectorAll('#lecList .item-row').forEach(r => r.classList.remove('drag-over'));
}
function onLecDragOver(e, idx) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('#lecList .item-row').forEach(r => r.classList.remove('drag-over'));
  const rows = document.querySelectorAll('#lecList .item-row');
  if (rows[idx]) rows[idx].classList.add('drag-over');
}
function onLecDrop(e, idx) {
  e.preventDefault();
  document.querySelectorAll('#lecList .item-row').forEach(r => r.classList.remove('drag-over'));
  if (dragSrcIdx === null || dragSrcIdx === idx) { dragSrcIdx = null; return; }
  const moved = lectures.splice(dragSrcIdx, 1)[0];
  lectures.splice(idx, 0, moved);
  saveData('lecturesData', lectures);
  renderLecList();
  toast('순서가 저장되었습니다');
  dragSrcIdx = null;
}

/* ── 강의 목록 렌더 (row 형식) ── */
function renderLecList() {
  const el = document.getElementById('lecList');
  if (!lectures.length) {
    el.innerHTML = '<div class="empty-state">강의가 없습니다. 추가해주세요.</div>';
    return;
  }
  el.innerHTML = lectures.map((lec, i) => `
    <div class="item-row" draggable="true"
         ondragstart="onLecDragStart(event,${i})"
         ondragend="onLecDragEnd(event)"
         ondragover="onLecDragOver(event,${i})"
         ondrop="onLecDrop(event,${i})">
      <div class="item-info">
        <span class="drag-handle" title="드래그로 순서 변경">☰</span>
        <span class="item-emoji">${lec.emoji || '📋'}</span>
        <div style="min-width:0">
          <div class="item-name">${escHtml(lec.title)}</div>
          <div class="item-meta">
            <span class="badge badge-dim">${escHtml(lec.category || '')}</span>
            · ${escHtml(lec.duration || '')} · ${escHtml(lec.format || '')}
          </div>
        </div>
      </div>
      <div class="item-actions">
        <button class="btn btn-outline btn-sm" onclick="openLecModal('edit', ${i})">수정</button>
        <button class="btn btn-danger btn-sm" onclick="deleteLecture(${i})">삭제</button>
      </div>
    </div>
  `).join('');
}

/* ══════════════════════════════════════
   강의이력 관리
══════════════════════════════════════ */
const DEFAULT_HIST = [
  { year: 2026, items: [
    '인사이트 코리아 AI 특강',
    '청주시 사회복지협의회 생성형 AI활용 자기개발 특강',
    '한국저작권 위원회 보도자료 역량강화 특강',
    '부경대학교 나노공학 AI 활용 대학생 교육 (3주)'
  ]},
  { year: 2025, items: [

function loadHistoryData() {
  return loadData('lectureHistoryData', DEFAULT_HIST);
}
function saveHistoryData(data) {
  saveData('lectureHistoryData', data);
}

/* ── 연도 카드 드래그 리오더 ── */
let histYearDragSrc = null;

function onHistYearDragStart(e, year) {
  histYearDragSrc = year;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => e.target.closest('.hist-year-card').style.opacity = '0.4', 0);
}
function onHistYearDragEnd(e) {
  const card = e.target.closest('.hist-year-card');
  if (card) card.style.opacity = '';
  document.querySelectorAll('.hist-year-card').forEach(c => c.classList.remove('drag-over'));
}
function onHistYearDragOver(e, year) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.hist-year-card').forEach(c => c.classList.remove('drag-over'));
  if (histYearDragSrc !== year) {
    e.target.closest('.hist-year-card')?.classList.add('drag-over');
  }
}
function onHistYearDrop(e, year) {
  e.preventDefault();
  document.querySelectorAll('.hist-year-card').forEach(c => c.classList.remove('drag-over'));
  if (histYearDragSrc === null || histYearDragSrc === year) { histYearDragSrc = null; return; }
  let data = loadHistoryData();
  const srcIdx = data.findIndex(g => g.year === histYearDragSrc);
  const dstIdx = data.findIndex(g => g.year === year);
  if (srcIdx === -1 || dstIdx === -1) { histYearDragSrc = null; return; }
  const moved = data.splice(srcIdx, 1)[0];
  data.splice(dstIdx, 0, moved);
  saveHistoryData(data);
  renderHistorySessions();
  toast('순서가 저장되었습니다');
  histYearDragSrc = null;
}

function renderHistorySessions() {
  const el = document.getElementById('historySessionList');
  let data = loadHistoryData();
  if (!data.length) {
    el.innerHTML = '<div class="hist-empty">이력이 없습니다. 연도를 추가해주세요.</div>';
    return;
  }
  el.innerHTML = data.map(group => `
    <div class="hist-year-card" draggable="true"
         ondragstart="onHistYearDragStart(event,${group.year})"
         ondragend="onHistYearDragEnd(event)"
         ondragover="onHistYearDragOver(event,${group.year})"
         ondrop="onHistYearDrop(event,${group.year})">
      <div class="hist-year-card-head" onclick="toggleHistYear(${group.year})">
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="hist-year-drag-handle" title="드래그로 순서 변경">☰</span>
          <span class="hist-year-label">${group.year}</span>
          <span style="font-size:12px;color:var(--sub);">${group.items.length}건</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteHistorySession(${group.year})">연도 삭제</button>
          <span class="hist-toggle-arrow" id="histArrow-${group.year}">▼</span>
        </div>
      </div>
      <div class="hist-year-body" id="histBody-${group.year}" style="display:none;"
           ondragstart="event.stopPropagation()">
        <textarea class="hist-textarea" id="histTextarea-${group.year}"
          placeholder="강의 항목을 한 줄에 하나씩 입력하세요...">${group.items.join('\n')}</textarea>
        <div class="hist-year-footer">
          <button class="btn btn-gold btn-sm" onclick="saveHistYear(${group.year})">저장</button>
        </div>
      </div>
    </div>
  `).join('');
}

function toggleHistYear(year) {
  const body  = document.getElementById('histBody-'  + year);
  const arrow = document.getElementById('histArrow-' + year);
  const isOpen = body.style.display !== 'none';
  body.style.display  = isOpen ? 'none' : '';
  arrow.textContent   = isOpen ? '▼' : '▲';
}

function saveHistYear(year) {
  const textarea = document.getElementById('histTextarea-' + year);
  const items = textarea.value.split('\n').map(s => s.trim()).filter(Boolean);
  let data = loadHistoryData();
  const group = data.find(g => g.year === year);
  if (!group) return;
  group.items = items;
  saveHistoryData(data);
  renderHistorySessions();
  toggleHistYear(year);
  toast('저장되었습니다');
}

function promptAddHistorySession() {
  const y = prompt('추가할 연도를 입력하세요 (예: 2027)');
  if (!y) return;
  const year = parseInt(y);
  if (isNaN(year) || year < 2000 || year > 2100) { toast('유효한 연도를 입력해주세요', true); return; }
  let data = loadHistoryData();
  if (data.find(g => g.year === year)) { toast('이미 존재하는 연도입니다', true); return; }
  data.unshift({ year, items: [] });
  saveHistoryData(data);
  renderHistorySessions();
  toast(`${year}년이 추가되었습니다`);
}

function deleteHistorySession(year) {
  if (!confirm(`${year}년 전체 이력을 삭제하시겠습니까?`)) return;
  let data = loadHistoryData().filter(g => g.year !== year);
  saveHistoryData(data);
  renderHistorySessions();
  toast('삭제되었습니다');
}

/* ── 모달 열기/닫기 ── */
function openLecModal(mode, idx) {
  const modal = document.getElementById('lecModal');
  if (mode === 'add') {
    document.getElementById('lecModalTitle').textContent = '강의 추가';
    document.getElementById('lecEditIndex').value = '';
    clearLecForm();
    buildCurRows([]);
  } else {
    document.getElementById('lecModalTitle').textContent = '강의 수정';
    document.getElementById('lecEditIndex').value = idx;
    fillLecForm(lectures[idx]);
    buildCurRows(lectures[idx].curriculum || []);
  }
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLecModal() {
  document.getElementById('lecModal').classList.remove('open');
  document.body.style.overflow = '';
}

function confirmCloseLec() {
  if (confirm('수정하신 내용을 취소하시겠습니까?')) closeLecModal();
}

/* ── 폼 초기화 / 채우기 ── */
function clearLecForm() {
  document.getElementById('lecEmoji').value    = '🤖';
  document.getElementById('lecCategory').value = '';
  document.getElementById('lecTitle').value    = '';
  document.getElementById('lecSubtitle').value = '';
  document.getElementById('lecDuration').value = '';
  document.getElementById('lecFormat').value   = '';
  document.getElementById('lecIntro').value    = '';
  document.getElementById('lecSupplies').value = '';
}

function fillLecForm(lec) {
  // 이모지 select 맞추기
  const sel = document.getElementById('lecEmoji');
  const match = [...sel.options].find(o => o.value === lec.emoji);
  sel.value = match ? lec.emoji : sel.options[0].value;

  document.getElementById('lecCategory').value = lec.category || '';
  document.getElementById('lecTitle').value    = lec.title    || '';
  document.getElementById('lecSubtitle').value = lec.subtitle || '';
  document.getElementById('lecDuration').value = lec.duration || '';
  document.getElementById('lecFormat').value   = lec.format   || '';
  document.getElementById('lecIntro').value    = lec.intro    || '';
  document.getElementById('lecSupplies').value = lec.supplies || '';
}

/* ── 커리큘럼 ── */
function buildCurRows(curriculum) {
  const container = document.getElementById('curRows');
  container.innerHTML = '';
  (curriculum || []).forEach(c => addCurRow(c));
}

function addCurRow(data) {
  const row = document.createElement('div');
  row.className = 'cur-row';
  row.innerHTML = `
    <input type="text" placeholder="시간"  value="${data ? escHtml(data.time  || '') : ''}" class="cur-time-input">
    <input type="text" placeholder="제목"  value="${data ? escHtml(data.title || '') : ''}" class="cur-title-input">
    <input type="text" placeholder="내용"  value="${data ? escHtml(data.desc  || '') : ''}" class="cur-desc-input">
    <button type="button" class="cur-del-btn" onclick="this.closest('.cur-row').remove()">✕</button>
  `;
  document.getElementById('curRows').appendChild(row);
}

/* ── 저장 ── */
function saveLecture() {
  const title = document.getElementById('lecTitle').value.trim();
  if (!title) { toast('강의명을 입력해주세요', true); return; }

  const curRows   = document.querySelectorAll('#curRows .cur-row');
  const curriculum = [...curRows].map(r => ({
    time:  r.querySelector('.cur-time-input').value.trim(),
    title: r.querySelector('.cur-title-input').value.trim(),
    desc:  r.querySelector('.cur-desc-input').value.trim()
  })).filter(c => c.title);

  const lec = {
    emoji:    document.getElementById('lecEmoji').value    || '📋',
    category: document.getElementById('lecCategory').value.trim(),
    title,
    subtitle: document.getElementById('lecSubtitle').value.trim(),
    duration: document.getElementById('lecDuration').value.trim() || '3시간~',
    format:   document.getElementById('lecFormat').value.trim()   || '현장 / 온라인',
    intro:    document.getElementById('lecIntro').value.trim(),
    supplies: document.getElementById('lecSupplies').value.trim(),
    curriculum
  };

  const idx = document.getElementById('lecEditIndex').value;
  if (idx !== '') { lectures[parseInt(idx)] = lec; } else { lectures.push(lec); }

  saveData('lecturesData', lectures);
  closeLecModal();
  renderLecList();
  toast(idx !== '' ? '강의가 수정되었습니다' : '강의가 추가되었습니다');
}

/* ── 삭제 ── */
function deleteLecture(i) {
  if (!confirm(`"${lectures[i].title}" 강의를 삭제하시겠습니까?`)) return;
  lectures.splice(i, 1);
  saveData('lecturesData', lectures);
  renderLecList();
  toast('강의가 삭제되었습니다');
}

/* ── 페이지 메시지 저장/로드 ── */
function loadLecMsg() {
  const d = loadData('pageMsgLectures', DEFAULT_PAGE_MSGS.lectures);
  document.getElementById('lecMainMsg').value = d.mainMsg  || '';
  document.getElementById('lecSubMsg').value  = d.subtitle || '';
  document.getElementById('lecMobile').value  = d.mobile   || '';
}
function saveLecMsg() {
  const d = {
    mainMsg:  document.getElementById('lecMainMsg').value.trim(),
    subtitle: document.getElementById('lecSubMsg').value.trim(),
    mobile:   document.getElementById('lecMobile').value.trim()
  };
  if (saveData('pageMsgLectures', d)) toast('메시지가 저장되었습니다');
  else toast('저장 실패', true);
}

// ── INIT ──
loadLecMsg();
renderLecList();
</script>
